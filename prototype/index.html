<title>Моя мастерская</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,500;0,600;0,700;1,500&family=Onest:wght@400;500;600&display=swap">
<style>
/* Идея: телефон-мастерская. Жемчужно-сиреневые нейтрали, чернильный текст, бирюзовый «AB-перелив» как единственный акцент.
   Заголовки — Cormorant (ювелирная изысканность), интерфейс — Onest (чистый кириллический гротеск). */
:root{
  --stage:#E7E3EE; --bg:#F4F2F7; --surface:#FFFFFF; --surface2:#F6F4F9; --line:#E3DFEB;
  --ink:#241F35; --ink2:#5F5A74; --ink3:#8F8AA3;
  --accent:#12787A; --accent-ink:#FFFFFF; --accent-soft:#DAF0EE;
  --btn:#2A2440; --btn-ink:#FFFFFF;
  --good:#1D8657; --good-soft:#DCF2E6; --warn:#A8620A; --warn-soft:#FBEBCC; --bad:#C4352D; --bad-soft:#FADFDC;
  --shadow:0 1px 2px rgba(36,31,53,.06),0 14px 40px rgba(36,31,53,.14); --shadow-s:0 1px 2px rgba(36,31,53,.12);
  --scrim:rgba(24,18,40,.46);
  --f-display:'Cormorant','Cormorant Garamond',Georgia,serif; --f-body:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --stage:#0A0910; --bg:#13111C; --surface:#1C1929; --surface2:#242035; --line:#322E46;
  --ink:#F0EDF8; --ink2:#B7B2CB; --ink3:#8B86A1;
  --accent:#4FC3BE; --accent-ink:#06302E; --accent-soft:#17383A;
  --btn:#EAE5F8; --btn-ink:#1C1929;
  --good:#52CD96; --good-soft:#173A2B; --warn:#EDB259; --warn-soft:#3F2E12; --bad:#FF8A80; --bad-soft:#44201E;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 40px rgba(0,0,0,.5); --shadow-s:0 1px 2px rgba(0,0,0,.5); --scrim:rgba(4,2,10,.62);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --stage:#0A0910; --bg:#13111C; --surface:#1C1929; --surface2:#242035; --line:#322E46;
  --ink:#F0EDF8; --ink2:#B7B2CB; --ink3:#8B86A1;
  --accent:#4FC3BE; --accent-ink:#06302E; --accent-soft:#17383A;
  --btn:#EAE5F8; --btn-ink:#1C1929;
  --good:#52CD96; --good-soft:#173A2B; --warn:#EDB259; --warn-soft:#3F2E12; --bad:#FF8A80; --bad-soft:#44201E;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 40px rgba(0,0,0,.5); --shadow-s:0 1px 2px rgba(0,0,0,.5); --scrim:rgba(4,2,10,.62);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--stage);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.4;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;-webkit-tap-highlight-color:transparent}
button[disabled]{cursor:not-allowed}
img{display:block;max-width:100%}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:16px;height:16px}
.px{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.mute{color:var(--ink2)} .mute3{color:var(--ink3)}
.num{font-variant-numeric:tabular-nums}

/* сцена и телефон */
.stage{height:100%;display:grid;grid-template-columns:minmax(0,1fr);place-items:center}
.app{position:relative;display:flex;flex-direction:column;width:100%;height:100%;background:var(--bg);overflow:hidden;min-width:0}
.side{display:none}
@media (min-width:620px){
  .stage{padding:18px}
  .app{width:410px;max-width:100%;height:min(880px,100%);border-radius:40px;border:1px solid var(--line);box-shadow:var(--shadow)}
}
@media (min-width:1040px){
  .stage{grid-template-columns:auto 340px;gap:56px;justify-content:center}
  .side{display:block;max-height:100%;overflow:auto;padding:6px 4px}
}
.screen{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-bottom:20px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:20px;padding-bottom:10px}
.top h1{font-family:var(--f-display);font-weight:600;font-size:34px;line-height:1;letter-spacing:-.01em}
.sub{font-size:12.5px;color:var(--ink2)}

/* таб-бар */
.tabbar{display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 4px 8px}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--ink3);position:relative;padding:2px 0}
.tab .pw{width:54px;height:30px;border-radius:15px;display:grid;place-items:center;transition:background .15s}
.tab.on{color:var(--ink);font-weight:600}
.tab.on .pw{background:var(--accent-soft);color:var(--accent)}
.tbadge{position:absolute;top:-1px;left:calc(50% + 8px);min-width:17px;height:17px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:10.5px;font-weight:600;display:grid;place-items:center;padding:0 4px}

/* кнопки, поля */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 18px;border-radius:14px;font-weight:600;font-size:15px;border:1px solid var(--line);background:var(--surface);white-space:nowrap}
.btn.pri{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.btn.acc{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.dng{color:var(--bad)}
.btn.sm{height:36px;padding:0 12px;font-size:13.5px;border-radius:11px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45}
.ibtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);flex:none}
.ibtn.sm{width:34px;height:34px;border-radius:10px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.lbl{font-size:12px;color:var(--ink2);font-weight:500}
.in{height:44px;width:100%;min-width:0;border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:0 12px}
.in.ta{height:auto;min-height:78px;padding:10px 12px;resize:vertical}
.in:disabled{opacity:.55}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink3) 50%),linear-gradient(135deg,var(--ink3) 50%,transparent 50%);background-position:calc(100% - 18px) 19px,calc(100% - 13px) 19px;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.hint{font-size:12px;color:var(--ink2)}
.seg{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;height:34px;border-radius:9px;font-size:13px;color:var(--ink2);font-weight:500}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-s)}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 6px 0 12px;height:46px;color:var(--ink3)}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:none;height:100%;color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-top:10px;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;color:var(--ink2);display:inline-flex;align-items:center;gap:6px}
.chip small{opacity:.65;font-size:11.5px}
.chip.on{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.chip.sub{height:30px;font-size:12.5px;background:transparent}
.chip.sub.on{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:500;background:var(--surface2);color:var(--ink2);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.acc{background:var(--accent-soft);color:var(--accent)}

/* карточки склада */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding-top:14px}
.mcard{display:flex;flex-direction:column;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;min-width:0}
.mcard .ph{position:relative;aspect-ratio:1/1;background:var(--surface2)}
.mcard .ph img{width:100%;height:100%;object-fit:cover}
.mcard .tags{position:absolute;top:8px;left:8px;display:flex;gap:4px;flex-wrap:wrap}
.mcard .tick{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.mcard .mb{padding:10px 11px 12px;display:flex;flex-direction:column;gap:3px;min-width:0}
.mcard b{font-weight:600;font-size:13.5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mcard .meta{font-size:11.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mcard .pr{display:flex;justify-content:space-between;align-items:baseline;gap:6px;margin-top:3px}
.mcard .pr .p{font-size:12px;color:var(--ink2)}
.mcard .pr .q{font-weight:600;font-size:13.5px}
.mcard .fr{font-size:11.5px;color:var(--accent);font-weight:500}
.empty{margin-top:22px;text-align:center;color:var(--ink2);display:flex;flex-direction:column;align-items:center;gap:12px;padding:30px 12px;border:1.5px dashed var(--line);border-radius:20px}
.empty b{color:var(--ink);font-family:var(--f-display);font-size:22px;font-weight:600}

/* карточки-списки */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
.card.flat{background:transparent;border-style:dashed}
.sect{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding-top:6px}
.sect h2{font-family:var(--f-display);font-size:23px;font-weight:600}
.thumb{width:48px;height:48px;border-radius:12px;object-fit:cover;background:var(--surface2);flex:none}
.thumb.lg{width:64px;height:64px;border-radius:14px}
.lcard{display:flex;gap:12px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px}
.lcard .t{font-weight:600;font-size:14.5px}
.lcard .s{font-size:12.5px;color:var(--ink2)}
.lcard .r{text-align:right;flex:none}
.mini{display:flex}
.mini img{width:26px;height:26px;border-radius:8px;border:2px solid var(--surface);margin-right:-6px;object-fit:cover}
.alert{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border-radius:14px;font-size:13px}
.alert.bad{background:var(--bad-soft);color:var(--bad)} .alert.warn{background:var(--warn-soft);color:var(--warn)} .alert.good{background:var(--good-soft);color:var(--good)}
.alert .ic{margin-top:1px}

/* страницы и шиты */
.page{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;z-index:20}
.page.anim{animation:slidein .24s ease-out}
.page-top{display:flex;align-items:center;gap:10px;padding-top:12px;padding-bottom:10px;border-bottom:1px solid var(--line);background:var(--bg)}
.pt-title{flex:1;min-width:0;display:flex;flex-direction:column}
.pt-title .ttl{font-family:var(--f-display);font-weight:600;font-size:24px;line-height:1.05}
.title-in{border:0;background:transparent;outline:none;font-family:var(--f-display);font-weight:600;font-size:24px;line-height:1.1;width:100%;min-width:0;padding:0}
.page-body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-top:14px;padding-bottom:26px}
.page-foot{padding-top:10px;padding-bottom:12px;border-top:1px solid var(--line);background:var(--surface);display:flex;gap:10px}
.sheet-wrap{position:absolute;inset:0;z-index:40;display:flex;align-items:flex-end;background:var(--scrim)}
.sheet{width:100%;max-height:93%;display:flex;flex-direction:column;background:var(--surface);border-radius:26px 26px 0 0;box-shadow:var(--shadow)}
.sheet.anim{animation:rise .24s ease-out}
.sheet-h{display:flex;align-items:center;gap:10px;padding-top:8px;padding-bottom:6px;position:relative}
.sheet-h::before{content:"";position:absolute;top:6px;left:50%;width:38px;height:4px;border-radius:2px;background:var(--line);transform:translateX(-50%)}
.sheet-h h2{flex:1;font-family:var(--f-display);font-weight:600;font-size:24px;line-height:1.1;padding-top:12px;min-width:0}
.sheet-h .ibtn{margin-top:12px}
.sheet-b{overflow-y:auto;padding-top:6px;padding-bottom:18px;display:flex;flex-direction:column;gap:14px}
.sheet-f{padding-top:10px;padding-bottom:14px;border-top:1px solid var(--line);display:flex;gap:10px}
@keyframes slidein{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes rise{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.toast{position:absolute;left:50%;bottom:88px;transform:translateX(-50%) translateY(8px);background:var(--btn);color:var(--btn-ink);padding:10px 16px;border-radius:14px;font-size:13.5px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:90;max-width:88%;text-align:center;box-shadow:var(--shadow)}
.toast.on{opacity:1;transform:translateX(-50%)}

/* фото в карточке материала */
.bigph{position:relative;aspect-ratio:4/3;border-radius:20px;overflow:hidden;background:var(--surface2)}
.bigph img{width:100%;height:100%;object-fit:cover}
.bigph .btn{position:absolute;right:10px;bottom:10px;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(6px)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface2);border-radius:14px;padding:10px 11px}
.stat .v{font-weight:600;font-size:17px}
.stat .k{font-size:11.5px;color:var(--ink2)}
.hist{display:flex;flex-direction:column}
.hist .h{display:flex;gap:10px;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px}
.pos{color:var(--good)} .neg{color:var(--bad)}

/* работа */
.part{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:10px}
.part.bad{border-color:var(--bad)}
.part .hd{display:flex;gap:10px;align-items:center}
.part .nm{font-weight:600;font-size:14px;line-height:1.25}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--surface2);overflow:hidden;height:44px}
.step button{width:42px;height:100%;display:grid;place-items:center;color:var(--ink2);flex:none}
.step button:active{background:var(--line)}
.step input{flex:1;min-width:0;width:100%;text-align:center;border:0;background:transparent;font-weight:600;font-size:16px;outline:none}
.part .info{font-size:12px;color:var(--ink2);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.timer{display:flex;flex-direction:column;gap:12px}
.clock{font-family:var(--f-display);font-size:48px;font-weight:600;line-height:1;letter-spacing:.01em;font-variant-numeric:tabular-nums}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}
.kv span{color:var(--ink2)} .kv b{font-variant-numeric:tabular-nums;white-space:nowrap}
.kv.bad span,.kv.bad b{color:var(--bad)}
.kv.total{border-bottom:0;padding-top:12px} .kv.total span{color:var(--ink);font-weight:600} .kv.total b{font-size:20px}
.pricebox{background:var(--accent-soft);color:var(--accent);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;margin:6px 0}
.pricebox .big{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1;color:var(--ink)}
.photo-drop{border:1.5px dashed var(--line);border-radius:18px;min-height:150px;display:grid;place-items:center;text-align:center;overflow:hidden;background:var(--surface2);color:var(--ink2)}
.photo-drop img{width:100%;max-height:260px;object-fit:cover}
.lock{display:inline-flex;align-items:center;gap:6px;color:var(--ink2);font-size:12px}
.rl{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.rl:last-child{border-bottom:0}
.rl .a{flex:1;min-width:0}
.rl .a b{font-weight:600;font-size:13.5px}
.rl .a span{display:block;font-size:12px;color:var(--ink2)}
.rl .c{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;font-size:13.5px;white-space:nowrap}
.rl .c small{display:block;font-weight:500;font-size:11.5px;color:var(--bad)}
textarea.json{width:100%;height:210px;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:10px;resize:vertical}
.check{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13px}
.check:last-child{border-bottom:0}
.check .ok{width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--good-soft);color:var(--good)}
.check .ok.no{background:var(--bad-soft);color:var(--bad)}
.check .ok .ic{width:14px;height:14px;stroke-width:2.4}
.check b{display:block;font-weight:600}
.check span{color:var(--ink2)}

/* боковая панель на десктопе */
.side h1{font-family:var(--f-display);font-weight:600;font-size:44px;line-height:.95;letter-spacing:-.01em}
.side h1 em{font-style:italic;color:var(--accent)}
.side .lead{margin:12px 0 20px;color:var(--ink2);font-size:14px;max-width:34ch}
.try{display:flex;flex-direction:column;gap:8px}
.try button{display:flex;gap:12px;text-align:left;padding:11px 12px;border:1px solid var(--line);background:var(--surface);border-radius:14px;align-items:flex-start}
.try button:hover{border-color:var(--accent)}
.try .n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:600;display:grid;place-items:center}
.try b{display:block;font-size:13.5px;font-weight:600}
.try span.t{font-size:12.5px;color:var(--ink2)}
.side .fine{margin-top:16px;font-size:12px;color:var(--ink3);max-width:38ch}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<symbol id="i-archive" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="4.5" rx="1.2"/><path d="M5 9v10.5h14V9M10 13h4"/></symbol>
<symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.2"/><circle cx="8" cy="17" r="2.2"/></symbol>

<script>
(() => {
'use strict';
/* ============================================================
   УТИЛИТЫ
============================================================ */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = p => p + '_' + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-3);
const r2 = n => Math.round((n + Number.EPSILON) * 100) / 100;
const nz = v => { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : 0; };
const money = n => (isFinite(n) ? r2(n) : 0).toLocaleString('ru-RU', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + ' ₺';
const num = n => Number(r2(n)).toLocaleString('ru-RU', {maximumFractionDigits: 2});
const nv = v => (v ? String(v) : '');
const MON = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
const todayISO = () => new Date().toISOString().slice(0, 10);
const fmtDate = iso => { const [y, m, d] = String(iso).split('-'); return `${+d} ${MON[+m - 1]} ${y}`; };
const fmtMin = m => { m = Math.round(m); const h = Math.floor(m / 60), mm = m % 60; return h ? `${h} ч ${String(mm).padStart(2, '0')} мин` : `${mm} мин`; };
const fmtClock = ms => { const s = Math.max(0, Math.floor(ms / 1000)); return [Math.floor(s / 3600), Math.floor(s % 3600 / 60), s % 60].map(v => String(v).padStart(2, '0')).join(':'); };
const pl = (n, f) => { n = Math.abs(n) % 100; const k = n % 10; return n > 10 && n < 20 ? f[2] : k > 1 && k < 5 ? f[1] : k === 1 ? f[0] : f[2]; };
const ic = (n, c = '') => `<svg class="ic ${c}" aria-hidden="true"><use href="#i-${n}"/></svg>`;

const CAT = ['Кристаллы Swarovski','Натуральные камни','Нитки и шнуры','Металл и фурнитура','Клеи и инструменты','Основы и ткани','Волосы и плетения','Упаковка','Другое'];
const KINDS = ['Серьги','Браслет','Колье','Заколка','Ободок','Съёмная коса','Сумочка','Другое'];
const UNITS = ['шт','м','см','г','мл'];
const REASONS = ['Инвентаризация','Потеря','Находка','Подарок','Исправление ошибки','Другое'];

/* ============================================================
   ИЛЛЮСТРАЦИИ ВМЕСТО ФОТО (SVG → data URI)
============================================================ */
function mix(hex, t) {
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = n >> 8 & 255, b = n & 255;
  const f = t >= 0 ? 255 : 0, a = Math.abs(t);
  r = Math.round(r + (f - r) * a); g = Math.round(g + (f - g) * a); b = Math.round(b + (f - b) * a);
  return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}
function art(kind, hex) {
  const hi = mix(hex, .55), lo = mix(hex, -.4), bg = mix(hex, .88), bg2 = mix(hex, .7);
  const P = (r, n, o = 0, cx = 60, cy = 60) => Array.from({length: n}, (_, i) => { const a = i / n * Math.PI * 2 + o; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; });
  const pts = a => a.map(p => p.map(v => v.toFixed(1)).join(',')).join(' ');
  let b = '';
  switch (kind) {
    case 'gem': { const o = P(40, 8, Math.PI / 8), i = P(19, 8, Math.PI / 8);
      b = `<polygon points="${pts(o)}" fill="url(#g)" stroke="${lo}" stroke-width="1.5"/>` +
        o.map((p, k) => `<line x1="${p[0].toFixed(1)}" y1="${p[1].toFixed(1)}" x2="${i[k][0].toFixed(1)}" y2="${i[k][1].toFixed(1)}" stroke="#fff" stroke-opacity=".6"/>`).join('') +
        `<polygon points="${pts(i)}" fill="#fff" fill-opacity=".28" stroke="#fff" stroke-opacity=".8"/><path d="M33 31l7-3" stroke="#fff" stroke-width="3" stroke-linecap="round"/>`; break; }
    case 'cab': b = [[42,72,27],[80,68,24],[62,36,21]].map(([x,y,r]) => `<circle cx="${x}" cy="${y}" r="${r}" fill="url(#g)"/><ellipse cx="${x - r*.35}" cy="${y - r*.4}" rx="${r*.28}" ry="${r*.16}" fill="#fff" fill-opacity=".45" transform="rotate(-30 ${x - r*.35} ${y - r*.4})"/>`).join(''); break;
    case 'chain': b = Array.from({length: 6}, (_, i) => { const x = 20 + i * 16, y = 88 - i * 11; return `<ellipse cx="${x}" cy="${y}" rx="13" ry="6.5" fill="none" stroke="${i % 2 ? lo : hex}" stroke-width="4.5" transform="rotate(${i % 2 ? -38 : 38} ${x} ${y})"/>`; }).join(''); break;
    case 'spool': b = `<rect x="30" y="18" width="60" height="10" rx="3" fill="${lo}"/><rect x="30" y="92" width="60" height="10" rx="3" fill="${lo}"/><rect x="36" y="28" width="48" height="64" fill="url(#g)"/>` + Array.from({length: 10}, (_, i) => `<path d="M36 ${33 + i * 6}h48" stroke="${lo}" stroke-opacity=".28"/>`).join(''); break;
    case 'tube': b = `<path d="M40 24h40l-6 68H46z" fill="url(#g)"/><rect x="46" y="92" width="28" height="14" rx="3" fill="${lo}"/><rect x="51" y="12" width="18" height="12" rx="3" fill="${lo}"/><path d="M48 40h24" stroke="#fff" stroke-opacity=".7" stroke-width="3"/>`; break;
    case 'tool': b = `<path d="M60 14 44 106" stroke="${lo}" stroke-width="7" stroke-linecap="round"/><path d="M60 14 78 106" stroke="${hex}" stroke-width="7" stroke-linecap="round"/><rect x="48" y="74" width="26" height="6" rx="3" fill="${lo}"/><path d="M58 22 52 60" stroke="#fff" stroke-opacity=".55" stroke-width="2.5" stroke-linecap="round"/>`; break;
    case 'hair': b = Array.from({length: 6}, (_, i) => `<ellipse cx="${i % 2 ? 50 : 70}" cy="${22 + i * 15}" rx="20" ry="10" fill="${i % 2 ? hex : hi}" stroke="${lo}" stroke-opacity=".5" transform="rotate(${i % 2 ? -28 : 28} ${i % 2 ? 50 : 70} ${22 + i * 15})"/>`).join(''); break;
    case 'clip': b = `<rect x="16" y="48" width="88" height="26" rx="13" fill="url(#g)"/><rect x="24" y="40" width="72" height="9" rx="4.5" fill="${lo}"/>` + Array.from({length: 8}, (_, i) => `<path d="M${30 + i * 9} 76v11" stroke="${lo}" stroke-width="3" stroke-linecap="round"/>`).join(''); break;
    case 'band': b = `<path d="M14 90Q60 -2 106 90" fill="none" stroke="${lo}" stroke-width="11" stroke-linecap="round"/><path d="M14 90Q60 -2 106 90" fill="none" stroke="${hex}" stroke-width="7" stroke-linecap="round"/><path d="M26 62Q40 38 56 28" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="2.5" stroke-linecap="round"/>`; break;
    case 'box': b = `<polygon points="60,20 98,40 60,60 22,40" fill="${hi}"/><polygon points="22,40 60,60 60,102 22,82" fill="${hex}"/><polygon points="98,40 60,60 60,102 98,82" fill="${lo}"/><path d="M60 60v42" stroke="#fff" stroke-opacity=".5" stroke-width="3"/>`; break;
    case 'ribbon': b = `<path d="M8 74Q34 34 60 62T112 46" fill="none" stroke="${lo}" stroke-width="20" stroke-linecap="round"/><path d="M8 74Q34 34 60 62T112 46" fill="none" stroke="${hex}" stroke-width="16" stroke-linecap="round"/><path d="M8 74Q34 34 60 62T112 46" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="2" stroke-dasharray="3 6"/>`; break;
    case 'rings': b = [[44,50],[66,50],[55,70],[77,70],[34,70]].map(([x, y], i) => `<circle cx="${x}" cy="${y}" r="13" fill="none" stroke="${i % 2 ? lo : hex}" stroke-width="5"/>`).join(''); break;
    case 'bracelet': b = P(34, 15, 0).map((p, i) => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${i % 3 === 0 ? 8.5 : 6.5}" fill="${i % 3 === 0 ? 'url(#g)' : hi}" stroke="${lo}" stroke-opacity=".35"/>`).join('') + `<circle cx="60" cy="60" r="34" fill="none" stroke="${lo}" stroke-opacity=".25" stroke-width="1"/>`; break;
    case 'earrings': b = [40, 80].map(x => `<path d="M${x} 10v20" stroke="${lo}" stroke-width="2.5"/><circle cx="${x}" cy="36" r="7" fill="url(#g)"/><path d="M${x} 46c-13 15-13 32 0 42 13-10 13-27 0-42z" fill="url(#g)" stroke="${lo}" stroke-opacity=".4"/><path d="M${x - 5} 56c-3 6-3 12-1 16" stroke="#fff" stroke-opacity=".6" stroke-width="2.5" stroke-linecap="round" fill="none"/>`).join(''); break;
    default: b = `<circle cx="60" cy="60" r="30" fill="url(#g)"/>`;
  }
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"><defs><radialGradient id="g" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="${hi}"/><stop offset=".55" stop-color="${hex}"/><stop offset="1" stop-color="${lo}"/></radialGradient><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${bg}"/><stop offset="1" stop-color="${bg2}"/></linearGradient></defs><rect width="120" height="120" fill="url(#bg)"/>${b}</svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}
function placeholder(name) {
  const t = (String(name || '?').trim()[0] || '?').toUpperCase();
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"><rect width="120" height="120" fill="#d9d4e6"/><text x="60" y="76" text-anchor="middle" font-family="Georgia,serif" font-size="52" fill="#8a82a6">${esc(t)}</text></svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}
const photoOf = m => (m && m.photo) || placeholder(m && m.name);

/* ============================================================
   ДВИЖОК: склад, закупки, резервы, себестоимость
   (функции принимают состояние st, чтобы их можно было проверить на пустом складе)
============================================================ */
const blankState = () => ({v: 2, categories: CAT.slice(), materials: [], purchases: [], movements: [], products: [], drafts: [], runs: [], finished: [], sales: [],
  settings: {hourly: 250, other: 0, fee: 12, margin: 30, shipping: 0, fx: {USD: 41.5, EUR: 45.2}}});
const mat = (st, id) => st.materials.find(m => m.id === id);
const isTool = m => !!m && m.mode === 'tool';
const stepOf = m => (m && m.unit === 'шт' ? 1 : 0.5);

function reservedBy(st, mid, exclude) {
  let r = 0; const m = mat(st, mid);
  st.drafts.forEach(d => { if (d.id === exclude) return; d.parts.forEach(p => { if (p.id === mid) r += isTool(m) ? p.scrap : p.used + p.scrap; }); });
  return r;
}
const freeOf = (st, m) => m.qty - reservedBy(st, m.id);

function allocateDelivery(sums, delivery) {
  const total = sums.reduce((a, b) => a + b, 0);
  return sums.map(s => total > 0 ? delivery * s / total : (sums.length ? delivery / sums.length : 0));
}
function makeMat(o) {
  return Object.assign({id: uid('m'), name: '', category: CAT[CAT.length - 1], subcategory: '', brand: '', size: '', color: '', sku: '', unit: 'шт', mode: 'cons', useCost: 0, photo: null, location: '', notes: '', min: 0, qty: 0, avg: 0}, o);
}
function commitPurchase(st, p) {
  const fx = p.currency === 'TRY' ? 1 : p.fx;
  const resolved = p.lines.map(l => {
    let m = l.materialId ? mat(st, l.materialId) : null;
    if (!m) { m = makeMat(l.newMat); st.materials.push(m); }
    return {l, m, units: l.packs * l.upp, sum: l.packs * l.pricePack * fx};
  });
  const shares = allocateDelivery(resolved.map(r => r.sum), p.delivery || 0);
  const rec = {id: uid('p'), date: p.date, supplier: p.supplier, currency: p.currency, fx, delivery: p.delivery || 0, lines: []};
  resolved.forEach((r, i) => {
    const unitCost = (r.sum + shares[i]) / r.units;
    const totalQty = r.m.qty + r.units;
    r.m.avg = totalQty > 0 ? (r.m.qty * r.m.avg + r.units * unitCost) / totalQty : unitCost;
    r.m.qty = totalQty;
    st.movements.unshift({id: uid('mv'), date: p.date, materialId: r.m.id, delta: r.units, unitCost, reason: 'Закупка: ' + (p.supplier || 'без поставщика'), ref: rec.id});
    rec.lines.push({materialId: r.m.id, packs: r.l.packs, upp: r.l.upp, pricePack: r.l.pricePack, count: r.units, unitCost, totalTry: r.sum, share: shares[i]});
  });
  st.purchases.unshift(rec);
  return rec;
}
const purchaseTotal = p => p.lines.reduce((s, l) => s + l.totalTry, 0) + p.delivery;

function partCost(m, p) {
  if (!m) return {inProd: 0, tool: 0, scrap: 0, total: 0};
  if (isTool(m)) { const tool = p.used * (m.useCost || 0), scrap = p.scrap * m.avg; return {inProd: 0, tool, scrap, total: tool + scrap}; }
  const inProd = p.used * m.avg, scrap = p.scrap * m.avg; return {inProd, tool: 0, scrap, total: inProd + scrap};
}
function minutesOf(d, now = Date.now()) {
  if (d.manualMinutes > 0) return d.manualMinutes;
  return (d.elapsedMs + (d.runningSince ? now - d.runningSince : 0)) / 60000;
}
function draftTotals(st, d, now = Date.now()) {
  let matIn = 0, toolUse = 0, scrapC = 0;
  d.parts.forEach(p => { const c = partCost(mat(st, p.id), p); matIn += c.inProd; toolUse += c.tool; scrapC += c.scrap; });
  const minutes = minutesOf(d, now), labor = minutes / 60 * d.hourly, other = d.other || 0;
  const cost = matIn + toolUse + scrapC + labor + other;
  const pct = (d.fee + d.margin) / 100, blocked = pct >= 0.99;
  const suggested = blocked ? NaN : (cost + d.shipping) / (1 - pct);
  const price = d.sale > 0 ? d.sale : suggested;
  const profit = isFinite(price) ? price - price * d.fee / 100 - d.shipping - cost : NaN;
  const profitPct = isFinite(price) && price > 0 ? Math.round(profit / price * 100) : 0;
  return {matIn, toolUse, scrapC, minutes, labor, other, cost, blocked, suggested, price, profit, profitPct, manual: d.manualMinutes > 0};
}
function partLimits(st, d, p) {
  const m = mat(st, p.id); const others = reservedBy(st, p.id, d.id);
  return {m, others, max: Math.max(0, m.qty - others)};
}
function validateDraft(st, d) {
  const e = [];
  if (!d.parts.length) e.push('Добавь хотя бы один материал.');
  d.parts.forEach(p => {
    const m = mat(st, p.id); if (!m) { e.push('Материал удалён из каталога.'); return; }
    const {others, max} = partLimits(st, d, p);
    if (isTool(m)) {
      if (p.used > 0 && m.qty < 1) e.push(`${m.name}: на складе нет ни одной единицы инструмента.`);
      if (p.scrap > max + 1e-9) e.push(`${m.name}: поломок ${num(p.scrap)}, а свободно ${num(max)}.`);
    } else if (p.used + p.scrap > max + 1e-9) e.push(`${m.name}: нужно ${num(p.used + p.scrap)} ${m.unit}, а свободно ${num(max)} (в других работах ${num(others)}).`);
  });
  if (d.fee + d.margin >= 99) e.push('Комиссия + желаемая прибыль ≥ 99%: цену посчитать нельзя.');
  return e;
}
function newDraft(st, {name, kind, bom, fromRun}) {
  const s = st.settings;
  const d = {id: uid('d'), productId: null, name, category: kind || 'Другое', collection: '', created: Date.now(), parts: [], hourly: s.hourly, other: s.other, fee: s.fee, margin: s.margin, shipping: s.shipping, sale: 0, elapsedMs: 0, runningSince: null, manualMinutes: 0, notes: ''};
  (bom || []).forEach(b => { if (mat(st, b.id)) d.parts.push({id: b.id, used: b.qty, scrap: 0}); });
  (fromRun || []).forEach(l => { if (mat(st, l.id)) d.parts.push({id: l.id, used: l.used, scrap: 0}); });
  return d;
}
function finalizeDraft(st, d, {photo = null, note = '', date = todayISO()} = {}) {
  const errors = validateDraft(st, d); if (errors.length) return {errors};
  const t = draftTotals(st, d);
  const runId = uid('r');
  const lines = d.parts.map(p => {
    const m = mat(st, p.id), c = partCost(m, p);
    return {id: m.id, name: m.name, unit: m.unit, mode: m.mode, size: m.size, color: m.color, used: p.used, scrap: p.scrap, quantity: isTool(m) ? p.scrap : p.used + p.scrap,
      unitCost: m.avg, useCost: m.useCost || 0, costInProduct: c.inProd + c.tool, costScrap: c.scrap, cost: c.total, photo: m.photo};
  });
  d.parts.forEach(p => {
    const m = mat(st, p.id); const out = isTool(m) ? p.scrap : p.used + p.scrap;
    if (out > 0) { m.qty = r2(m.qty - out); st.movements.unshift({id: uid('mv'), date, materialId: m.id, delta: -out, unitCost: m.avg, reason: (isTool(m) ? 'Поломка инструмента: ' : 'Работа: ') + d.name, ref: runId}); }
  });
  const run = {id: runId, productId: d.productId, name: d.name, category: d.category, date, photo, materialLines: lines,
    materialCost: t.matIn, toolCost: t.toolUse, scrapCost: t.scrapC, laborMinutes: t.minutes, hourly: d.hourly, laborCost: t.labor, otherCost: t.other,
    costTotal: t.cost, fee: d.fee, margin: d.margin, shipping: d.shipping, plannedPrice: isFinite(t.price) ? t.price : 0, suggestedPrice: isFinite(t.suggested) ? t.suggested : 0, note};
  st.runs.unshift(run);
  st.finished.unshift({id: uid('f'), runId, name: d.name, photo, cost: t.cost, price: run.plannedPrice, status: 'stock', soldPrice: 0, soldDate: null, created: date});
  st.drafts = st.drafts.filter(x => x.id !== d.id);
  return {run};
}

/* ============================================================
   ДЕМО-ДАННЫЕ
============================================================ */
function buildSeed() {
  const st = blankState();
  const M = o => { const m = makeMat(o); st.materials.push(m); return m; };
  const init = (m, qty, avg) => { m.qty = qty; m.avg = avg; st.movements.push({id: uid('mv'), date: '2026-09-01', materialId: m.id, delta: qty, unitCost: avg, reason: 'Начальный остаток', ref: null}); };
  const C = CAT;
  M({id: 'm_ss16', name: 'Стразы Swarovski SS16', category: C[0], subcategory: 'Hotfix', brand: 'Swarovski', size: 'SS16 (4 мм)', color: 'Crystal AB', sku: '2038-SS16-AB', location: 'Коробка A1', min: 30, photo: art('gem', '#8fc4e6')});
  M({id: 'm_xir29', name: 'Шатоны Swarovski SS29', category: C[0], subcategory: 'No Hotfix', brand: 'Swarovski', size: 'SS29 (6,2 мм)', color: 'Sapphire', sku: '1088-SS29-SAP', location: 'Коробка A2', min: 24, photo: art('gem', '#2f5fb8')});

function migrate(st) {
  const b = blankState();
  Object.keys(b).forEach(k => { if (st[k] == null) st[k] = b[k]; });
  st.settings = Object.assign({}, b.settings, st.settings); st.settings.fx = Object.assign({}, b.settings.fx, st.settings.fx || {});
  st.materials = st.materials.map(m => makeMat(m));
  st.drafts.forEach(d => { d.parts = (d.parts || []).map(p => ({id: p.id, used: +p.used || 0, scrap: +p.scrap || 0}));
    ['hourly','other','fee','margin','shipping','sale','elapsedMs','manualMinutes'].forEach(k => { d[k] = +d[k] || (k === 'hourly' ? st.settings.hourly : 0); });
    d.notes = d.notes || ''; d.runningSince = d.runningSince || null; d.category = d.category || 'Другое'; });
  st.v = 2; return st;
}

function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2600); }
function pickPhoto(cb) {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*'; inp.style.display = 'none'; document.body.appendChild(inp);
  inp.onchange = () => { const f = inp.files && inp.files[0]; inp.remove(); if (!f) return;
    const rd = new FileReader(); rd.onload = () => { const img = new Image();
      img.onload = () => { const k = Math.min(1, 640 / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); cb(c.toDataURL('image/jpeg', .82)); };
      img.onerror = () => toast('Не удалось прочитать фото'); img.src = rd.result; };
    rd.readAsDataURL(f); };
  inp.click();
}
function pickTextFile(cb) {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json'; inp.style.display = 'none'; document.body.appendChild(inp);
  inp.onchange = () => { const f = inp.files && inp.files[0]; inp.remove(); if (!f) return; const rd = new FileReader(); rd.onload = () => cb(String(rd.result)); rd.readAsText(f); };
  inp.click();
}

function stockFilter() {
  const toks = ui.q.toLowerCase().split(/\s+/).filter(Boolean);
  return S.materials.filter(m => {
    if (ui.cat !== 'all' && m.category !== ui.cat) return false;
    if (ui.sub !== 'all' && m.subcategory !== ui.sub) return false;
    if (!toks.length) return true;
    const h = [m.name, m.brand, m.category, m.subcategory, m.sku, m.color, m.size].join(' ').toLowerCase();
    return toks.every(t => h.includes(t));
  }).sort((a, b) => S.categories.indexOf(a.category) - S.categories.indexOf(b.category) || a.name.localeCompare(b.name, 'ru'));
}
function mcard(m, act = 'openMat', inDraft = false) {

  const meta = [m.brand, m.size, m.color].filter(Boolean).join(' · ');
  return `<button class="mcard" data-act="${act}" data-id="${m.id}">
    <div class="ph"><img src="${photoOf(m)}" alt="" loading="lazy">
      <div class="tags">${isTool(m) ? '<span class="pill acc">инструмент</span>' : ''}${low ? '<span class="pill warn">мало</span>' : ''}</div>

}
function partHTML(d, p, i) {
  const m = mat(S, p.id); if (!m) return '';
  const {others, max} = partLimits(S, d, p), tool = isTool(m);
  const over = tool ? (p.scrap > max + 1e-9 || (p.used > 0 && m.qty < 1)) : (p.used + p.scrap > max + 1e-9);
  const c = partCost(m, p), after = tool ? m.qty - p.scrap : m.qty - p.used - p.scrap;
  return `<div class="part ${over ? 'bad' : ''}">
    <div class="hd"><img class="thumb" src="${photoOf(m)}" alt=""><div class="grow"><div class="nm">${esc(m.name)}</div>
      <div class="hint">${esc([m.size, m.color].filter(Boolean).join(' · ')) || '&nbsp;'} ${tool ? '<span class="pill acc">инструмент</span>' : ''}</div></div>

    <div class="two"><div class="fld"><span class="lbl">${tool ? 'Применений' : 'В изделии, ' + esc(m.unit)}</span>${stepper(i, 'used', p.used, m)}</div>
      <div class="fld"><span class="lbl">${tool ? 'Поломка, шт' : 'Брак / потери, ' + esc(m.unit)}</span>${stepper(i, 'scrap', p.scrap, m)}</div></div>
    <div class="info num">${tool
      ? `<span>На складе ${num(m.qty)} шт · ${num(m.useCost)} ₺ за применение</span>`
      : `<span>Свободно ${num(max)} ${esc(m.unit)}${others ? ` (в других работах ${num(others)})` : ''}</span><span>после работы: ${num(after)}</span>`}

============================================================ */
function runChecks() {
  const out = [], st = blankState();
  const CATS = st.categories;
  commitPurchase(st, {date: '2026-01-01', supplier: 'Тест', currency: 'TRY', fx: 1, delivery: 30, lines: [{newMat: {name: 'Камни', category: CATS[0], unit: 'шт'}, packs: 1, upp: 100, pricePack: 300}]});
  const m = st.materials[0];
  out.push({n: 1, t: 'Закупка 100 камней по 3 ₺ + доставка 30 ₺', exp: '100 шт, 3,30 ₺', got: `${num(m.qty)} шт, ${money(m.avg)}`, ok: m.qty === 100 && Math.abs(m.avg - 3.3) < 1e-9});
  const tool = makeMat({name: 'Пинцет', category: CATS[4], mode: 'tool', useCost: 12, qty: 2, avg: 180}); st.materials.push(tool);
  const d = newDraft(st, {name: 'Тест', kind: 'Другое'}); d.parts.push({id: m.id, used: 20, scrap: 1}); st.drafts.push(d);
  const res = reservedBy(st, m.id), fr = freeOf(st, m);
  out.push({n: 4, t: 'Черновик: 20 в изделии + 1 брак', exp: 'резерв 21, свободно 79, склад 100', got: `резерв ${num(res)}, свободно ${num(fr)}, склад ${num(m.qty)}`, ok: res === 21 && fr === 79 && m.qty === 100});
  d.manualMinutes = 60; d.hourly = 250; d.other = 0; d.fee = 12; d.margin = 30;
  const t = draftTotals(st, d);
  out.push({n: 6, t: '60 минут при 250 ₺/ч', exp: 'материалы 69,30 + труд 250 = 319,30 ₺', got: `${money(t.matIn + t.scrapC)} + ${money(t.labor)} = ${money(t.cost)}`, ok: Math.abs(t.cost - 319.3) < 1e-9});
  const f = finalizeDraft(st, d, {});
  out.push({n: 7, t: 'После завершения', exp: 'физический остаток 79 шт', got: `${num(m.qty)} шт, в архиве ${money(f.run.costTotal)}`, ok: m.qty === 79 && Math.abs(f.run.costTotal - 319.3) < 1e-9});
  commitPurchase(st, {date: '2026-02-01', supplier: 'Тест 2', currency: 'TRY', fx: 1, delivery: 0, lines: [{materialId: m.id, packs: 1, upp: 100, pricePack: 600}]});
  out.push({n: 8, t: 'Повторная закупка дороже', exp: 'архив остался 319,30 ₺', got: `средняя цена теперь ${money(m.avg)}, архив ${money(st.runs[0].costTotal)}`, ok: Math.abs(st.runs[0].costTotal - 319.3) < 1e-9 && m.avg > 3.3});
  const d2 = newDraft(st, {name: 'Тест 2', kind: 'Другое'}); d2.parts.push({id: tool.id, used: 3, scrap: 0}); st.drafts.push(d2);
  const t1 = draftTotals(st, d2); d2.parts[0].scrap = 1; const t2 = draftTotals(st, d2);
  const f2 = finalizeDraft(st, d2, {});
  out.push({n: 9, t: 'Инструмент: 3 применения по 12 ₺, затем поломка 1 шт', exp: '+36 ₺, остаток 2 шт; с поломкой +180 ₺ и остаток 1 шт', got: `${money(t1.toolUse)}, с поломкой ${money(t2.toolUse + t2.scrapC)}, остаток ${num(tool.qty)} шт`, ok: Math.abs(t1.toolUse - 36) < 1e-9 && Math.abs(t2.toolUse + t2.scrapC - 216) < 1e-9 && tool.qty === 1 && !!f2.run});
  return out;
}

function pfCalc() {
  const pf = ui.pf, fx = pf.currency === 'TRY' ? 1 : pf.fx;
  const rows = pf.lines.map(l => ({l, units: l.packs * l.upp, sum: l.packs * l.pricePack * fx}));
  const shares = allocateDelivery(rows.map(r => r.sum), pf.delivery);
  rows.forEach((r, i) => { r.share = shares[i]; r.unit = r.units > 0 ? (r.sum + r.share) / r.units : 0; });
  const items = rows.reduce((a, r) => a + r.sum, 0);
  return {rows, items, delivery: pf.delivery, grand: items + pf.delivery};
}
function lineInfo(l) {

function renderPages() {

A.addPart = () => { const d = curDraft(); ui.pk = {mode: 'draft', q: '', cat: 'all', draftId: d.id}; pushSheet({type: 'pick'}); };

function clampPart(d, i, field) {
  const p = d.parts[i], m = mat(S, p.id), {max} = partLimits(S, d, p);
  if (isTool(m)) { if (p.scrap > max) { p.scrap = max; toast(`Свободно только ${num(max)} шт`); } return; }
  if (p.used + p.scrap > max + 1e-9) {
    if (field === 'scrap') p.scrap = Math.max(0, r2(max - p.used)); else if (field === 'used') p.used = Math.max(0, r2(max - p.scrap)); else { p.scrap = Math.min(p.scrap, max); p.used = Math.max(0, r2(max - p.scrap)); }
    toast(`Свободно всего ${num(max)} ${m.unit}: больше зарезервировать нельзя`);
  }
}
function setPart(d, i, f, v) { const p = d.parts[i]; p[f] = Math.max(0, r2(v)); clampPart(d, i, f); save(); renderPages(); renderTabbar(); }

  else if (k === 'search') { ui.tab = 'stock'; ui.cat = 'all'; ui.sub = 'all'; ui.q = 'SS16'; }
  else if (k === 'archive') { ui.tab = 'arch'; ui.archSeg = 'runs'; const r = S.runs.find(x => x.name.includes('Лабрадор')) || S.runs[0]; if (r) ui.pages = [{type: 'run', id: r.id}]; }
  else if (k === 'backup') { ui.tab = 'more'; ui.sheets = [{type: 'exp'}]; }
  render(); if (k === 'time') toast('Впиши минуты в поле «Вручную»');
};

============================================================ */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const f = A[el.dataset.act]; if (f) f(el, e);
});
function rootOf(n) { return n === 'ui' ? ui : n === 'S' ? S : n === 'D' ? curDraft() : n === 'R' ? curRun() : null; }
function onModel(el) {
  const path = el.dataset.m; if (!path) return; const parts = path.split('.');
  let o = rootOf(parts[0]); if (!o) return;
  for (let i = 1; i < parts.length - 1; i++) o = o[parts[i]];
  const key = parts[parts.length - 1];
  o[key] = el.hasAttribute('data-num') ? nz(el.value) : el.value;
  if (path === 'ui.q') refreshStock();
  else if (path === 'ui.pk.q') { const g = $('#pk_grid'); if (g) g.innerHTML = pickGrid(); }
  else if (parts[0] === 'D') { save(); refreshDraft(); if (path === 'D.name') renderTabbar(); }
  else if (path.startsWith('ui.lf.')) refreshLine();
  else if (path.startsWith('ui.pf.')) { refreshPf(); }
  else if (parts[0] === 'S' || parts[0] === 'R') save();
}
document.addEventListener('input', e => { if (e.target.dataset && e.target.dataset.m && e.target.tagName !== 'SELECT' && e.target.type !== 'date') onModel(e.target); });
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset && t.dataset.part !== undefined) { const d = curDraft(); if (d) setPart(d, +t.dataset.part, t.dataset.f, nz(t.value)); return; }
  if (t.dataset && t.dataset.cat !== undefined) {
    const i = +t.dataset.cat, old = S.categories[i], nn = t.value.trim();
    if (!nn || (nn !== old && S.categories.some(c => c.toLowerCase() === nn.toLowerCase()))) { toast(nn ? 'Такая категория уже есть' : 'Название не может быть пустым'); t.value = old; return; }
    S.categories[i] = nn; S.materials.forEach(m => { if (m.category === old) m.category = nn; }); if (ui.cat === old) ui.cat = nn; save(); renderScreen(); toast('Категория переименована'); return;
  }
  if (t.dataset && t.dataset.m && (t.tagName === 'SELECT' || t.type === 'date')) { onModel(t); if (t.dataset.m === 'ui.lf.unit') refreshLine(); if (t.dataset.m === 'ui.pf.date') return; }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (ui.sheets.length) popSheet(); else if (ui.pages.length) A.back(); }
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.part !== undefined) e.target.blur();
});
setInterval(() => {
  const p = curPage(); if (!p || p.type !== 'draft') return;
  const d = curDraft(); if (!d) return;
  const c = $('#clock'); if (c) c.textContent = fmtClock(d.elapsedMs + (d.runningSince ? Date.now() - d.runningSince : 0));
  if (d.runningSince) { const tu = $('#timeUsed'); if (tu) tu.textContent = timeUsedText(d); const tt = $('#totals'); if (tt && !tt.contains(document.activeElement)) tt.innerHTML = totalsHTML(d); }
}, 1000);

$('#side').innerHTML = sideHTML();
render();
})();
