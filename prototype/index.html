<title>Моя мастерская</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Cormorant:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Nunito:wght@400;500;600;700;800&display=swap">
<style>
/* Идея: бохо-мастерская. Льняной песок, шалфей, глина и охра; арки вместо квадратов, живые листья, мягкие «выплывания».
   Заголовки — Cormorant, рукописные акценты — Caveat, весь интерфейс и ВСЕ цифры — Nunito (лайнинговые цифры, читаются легко). */
:root{
  --stage:#E5D7BF; --bg:#F5EDE0; --surface:#FCF8F0; --surface2:#F1E7D6; --line:#E2D3B9;
  --ink:#3A2E24; --ink2:#6E5E4E; --ink3:#9A8A76;
  --clay:#B5593A; --clay-ink:#FFF7EC; --clay-soft:#F2D8C9;
  --accent:#5F7A52; --accent-ink:#FFFFFF; --accent-soft:#DDE5CF;
  --ochre:#D39A2F; --ochre-soft:#F6E3B6; --rose:#D69A8B;
  --btn:#4A3B2C; --btn-ink:#FBF3E4;
  --good:#4F7A3F; --good-soft:#DDE8CC; --warn:#935E12; --warn-soft:#F6E3B6; --bad:#B6382B; --bad-soft:#F4D5CE;
  --shadow:0 2px 4px rgba(74,59,44,.08),0 18px 44px rgba(74,59,44,.18); --shadow-s:0 1px 2px rgba(74,59,44,.16); --shadow-c:0 1px 0 rgba(255,255,255,.6) inset,0 6px 18px rgba(120,86,50,.10);
  --scrim:rgba(46,32,20,.5);
  --f-display:'Cormorant','Cormorant Garamond',Georgia,serif; --f-hand:'Caveat','Segoe Script',cursive; --f-body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --stage:#120E0A; --bg:#1B1611; --surface:#262019; --surface2:#2F281F; --line:#40362A;
  --ink:#F3E8D6; --ink2:#C4B49C; --ink3:#968670;
  --clay:#D9805A; --clay-ink:#2A130A; --clay-soft:#4A281C;
  --accent:#A5BD8F; --accent-ink:#17210F; --accent-soft:#2C3624;
  --ochre:#E7B658; --ochre-soft:#443414; --rose:#C98A7B;
  --btn:#EADCC4; --btn-ink:#261F17;
  --good:#9BCB86; --good-soft:#26361E; --warn:#EDB259; --warn-soft:#3F2E12; --bad:#FF9B8A; --bad-soft:#44201E;
  --shadow:0 2px 4px rgba(0,0,0,.4),0 18px 44px rgba(0,0,0,.55); --shadow-s:0 1px 2px rgba(0,0,0,.5); --shadow-c:0 1px 0 rgba(255,255,255,.04) inset,0 6px 18px rgba(0,0,0,.3);
  --scrim:rgba(4,2,0,.64); color-scheme:dark}}
:root[data-theme="dark"]{
  --stage:#120E0A; --bg:#1B1611; --surface:#262019; --surface2:#2F281F; --line:#40362A;
  --ink:#F3E8D6; --ink2:#C4B49C; --ink3:#968670;
  --clay:#D9805A; --clay-ink:#2A130A; --clay-soft:#4A281C;
  --accent:#A5BD8F; --accent-ink:#17210F; --accent-soft:#2C3624;
  --ochre:#E7B658; --ochre-soft:#443414; --rose:#C98A7B;
  --btn:#EADCC4; --btn-ink:#261F17;
  --good:#9BCB86; --good-soft:#26361E; --warn:#EDB259; --warn-soft:#3F2E12; --bad:#FF9B8A; --bad-soft:#44201E;
  --shadow:0 2px 4px rgba(0,0,0,.4),0 18px 44px rgba(0,0,0,.55); --shadow-s:0 1px 2px rgba(0,0,0,.5); --shadow-c:0 1px 0 rgba(255,255,255,.04) inset,0 6px 18px rgba(0,0,0,.3);
  --scrim:rgba(4,2,0,.64); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--stage);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.4;-webkit-text-size-adjust:100%;font-variant-numeric:lining-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;-webkit-tap-highlight-color:transparent}
button[disabled]{cursor:not-allowed}
img{display:block;max-width:100%}
h1,h2,h3,p{margin:0}
a{color:var(--accent);font-weight:600}
:focus-visible{outline:2px solid var(--clay);outline-offset:2px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:16px;height:16px}
.px{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.mute{color:var(--ink2)}
.num{font-variant-numeric:lining-nums tabular-nums}
.kick{font-family:var(--f-hand);font-size:21px;line-height:1;color:var(--clay);font-weight:700;display:block;margin-bottom:2px}

/* сцена и телефон */
.stage{height:100%;display:grid;grid-template-columns:minmax(0,1fr);place-items:center}
.app{position:relative;display:flex;flex-direction:column;width:100%;height:100%;background:var(--bg);overflow:hidden;min-width:0}
.app::before,.app::after{content:"";position:absolute;border-radius:50%;filter:blur(44px);opacity:.6;pointer-events:none;z-index:0}
.app::before{width:260px;height:260px;background:var(--clay-soft);top:-70px;right:-80px;animation:drift 15s ease-in-out infinite alternate}
.app::after{width:240px;height:240px;background:var(--accent-soft);bottom:110px;left:-90px;animation:drift 19s ease-in-out infinite alternate-reverse}
.side{display:none}
@media (min-width:620px){
  .stage{padding:18px}
  .app{width:410px;max-width:100%;height:min(880px,100%);border-radius:42px;border:1px solid var(--line);box-shadow:var(--shadow)}
}
@media (min-width:1040px){
  .stage{grid-template-columns:auto 350px;gap:56px;justify-content:center}
  .side{display:block;max-height:100%;overflow:auto;padding:6px 6px}
}
.modebar{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:12px;padding-bottom:2px}
.brand{display:flex;align-items:center;gap:6px;font-family:var(--f-hand);font-weight:700;font-size:23px;color:var(--clay);line-height:1;white-space:nowrap}
.brand .ic{width:26px;height:26px;color:var(--accent);transform-origin:50% 100%;animation:sway 4.5s ease-in-out infinite}
.modeseg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.modeseg button{height:30px;padding:0 11px;border-radius:999px;font-size:12.5px;font-weight:700;color:var(--ink2);transition:background .25s,color .25s,transform .15s}
.modeseg button.on{background:var(--clay);color:var(--clay-ink)}
.modeseg button:active{transform:scale(.94)}
.screen{position:relative;z-index:1;flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-bottom:22px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:12px;padding-bottom:10px}
.top h1{font-family:var(--f-display);font-weight:600;font-style:italic;font-size:36px;line-height:1;letter-spacing:-.01em}
.sub{font-size:12.5px;color:var(--ink2)}

/* таб-бар с волной */
.tabbar{position:relative;z-index:3;display:grid;background:var(--surface);padding:8px 4px 8px;box-shadow:0 -8px 22px rgba(120,86,50,.08)}
.tabbar::before{content:"";position:absolute;left:0;right:0;top:-7px;height:7px;background:radial-gradient(circle 7px at 50% 0,transparent 6.4px,var(--surface) 7px) 0 0/14px 7px repeat-x}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--ink3);position:relative;padding:2px 0;font-weight:600}
.tab .pw{width:54px;height:30px;border-radius:15px;display:grid;place-items:center;transition:background .3s,transform .2s}
.tab:active .pw{transform:scale(.9)}
.tab.on{color:var(--ink);font-weight:800}
.tab.on .pw{background:var(--accent-soft);color:var(--accent)}
.tab.on .pw .ic{animation:bob .55s ease}
.tbadge{position:absolute;top:-1px;left:calc(50% + 8px);min-width:17px;height:17px;border-radius:9px;background:var(--clay);color:var(--clay-ink);font-size:10.5px;font-weight:800;display:grid;place-items:center;padding:0 4px}

/* кнопки, поля */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 18px;border-radius:16px;font-weight:700;font-size:15px;border:1.5px solid var(--line);background:var(--surface);white-space:nowrap;transition:transform .15s,box-shadow .2s,background .2s}
.btn:not([disabled]):hover{box-shadow:var(--shadow-c)}
.btn:not([disabled]):active{transform:scale(.96)}
.btn.pri{background:var(--clay);color:var(--clay-ink);border-color:var(--clay)}
.btn.acc{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.dng{color:var(--bad)}
.btn.sm{height:36px;padding:0 13px;font-size:13.5px;border-radius:12px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45}
.ibtn{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;border:1.5px solid var(--line);background:var(--surface);flex:none;transition:transform .15s}
.ibtn:active{transform:scale(.92)}
.ibtn.sm{width:34px;height:34px;border-radius:11px}
.ibtn.fill{background:var(--clay);color:var(--clay-ink);border-color:var(--clay)}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.lbl{font-size:12px;color:var(--ink2);font-weight:700}
.in{height:44px;width:100%;min-width:0;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:0 12px;transition:border-color .2s,box-shadow .2s}
.in:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.in.ta{height:auto;min-height:78px;padding:10px 12px;resize:vertical}
.in:disabled{opacity:.55}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink3) 50%),linear-gradient(135deg,var(--ink3) 50%,transparent 50%);background-position:calc(100% - 18px) 19px,calc(100% - 13px) 19px;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.hint{font-size:12px;color:var(--ink2)}
.seg{display:flex;background:var(--surface2);border:1.5px solid var(--line);border-radius:14px;padding:3px;gap:3px}
.seg button{flex:1;height:34px;border-radius:11px;font-size:13px;color:var(--ink2);font-weight:700;transition:background .25s,color .25s}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-s)}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:0 6px 0 14px;height:48px;color:var(--ink3);transition:border-color .2s,box-shadow .2s}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:none;height:100%;color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-top:10px;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-size:13px;color:var(--ink2);display:inline-flex;align-items:center;gap:6px;font-weight:700;transition:background .25s,color .25s,transform .15s}
.chip:active{transform:scale(.93)}
.chip small{opacity:.65;font-size:11.5px}
.chip.on{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.chip.sub{height:30px;font-size:12.5px;background:transparent}
.chip.sub.on{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 9px;border-radius:999px;font-size:11.5px;font-weight:700;background:var(--surface2);color:var(--ink2);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.acc{background:var(--accent-soft);color:var(--accent)} .pill.clay{background:var(--clay-soft);color:var(--clay)}
button.pill{height:28px;padding:0 6px 0 11px;cursor:pointer;transition:transform .15s;flex:none}
button.pill:hover{transform:translateX(2px)}
.dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);color:var(--ink3);flex:none}
.dot.on{background:var(--good-soft);color:var(--good)}
.dot .ic{width:14px;height:14px;stroke-width:2.4}

/* карточки склада: арки */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding-top:14px}
.mcard{display:flex;flex-direction:column;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:24px;overflow:hidden;min-width:0;box-shadow:var(--shadow-c);transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s}
.mcard:hover{transform:translateY(-3px) rotate(-.4deg);box-shadow:0 12px 26px rgba(120,86,50,.18)}
.mcard:active{transform:scale(.97)}
.mcard .ph{position:relative;margin:8px 8px 0;aspect-ratio:5/6;border-radius:999px 999px 16px 16px;overflow:hidden;background:var(--surface2)}
.mcard .ph img{width:100%;height:100%;object-fit:cover}
.mcard .tags{position:absolute;bottom:8px;left:8px;display:flex;gap:4px;flex-wrap:wrap}
.mcard .tick{position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;animation:popn .4s}
.mcard .mb{padding:10px 12px 13px;display:flex;flex-direction:column;gap:3px;min-width:0}
.mcard b{font-weight:800;font-size:13.5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mcard .meta{font-size:11.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mcard .pr{display:flex;justify-content:space-between;align-items:baseline;gap:6px;margin-top:3px}
.mcard .pr .p{font-size:12px;color:var(--ink2)}
.mcard .pr .q{font-weight:800;font-size:13.5px}
.mcard .fr{font-size:11.5px;color:var(--accent);font-weight:700}
.empty{margin-top:22px;text-align:center;color:var(--ink2);display:flex;flex-direction:column;align-items:center;gap:12px;padding:30px 14px;border:2px dashed var(--line);border-radius:28px}
.empty b{color:var(--ink);font-family:var(--f-display);font-style:italic;font-size:24px;font-weight:600}
.empty::before{content:"";width:46px;height:46px;background:var(--accent);opacity:.55;-webkit-mask:var(--sprig) center/contain no-repeat;mask:var(--sprig) center/contain no-repeat;animation:sway 5s ease-in-out infinite}
:root{--sprig:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 22V4'/%3E%3Cpath d='M12 18c-4 0-6-2-6-5 4 0 6 2 6 5zM12 13c4 0 6-2 6-5-4 0-6 2-6 5zM12 9c-3.5 0-5-1.6-5-4.2 3.5 0 5 1.6 5 4.2z'/%3E%3C/svg%3E")}

/* карточки-списки */
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:24px;padding:15px;box-shadow:var(--shadow-c)}
.card.flat{background:transparent;border-style:dashed;box-shadow:none}
.sect{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding-top:6px}
.sect h2{font-family:var(--f-display);font-style:italic;font-size:25px;font-weight:600;position:relative}
.sect h2::after{content:"";display:block;height:5px;width:44px;margin-top:2px;background:radial-gradient(circle,var(--ochre) 1.6px,transparent 2px) 0 0/9px 5px repeat-x}
.thumb{width:48px;height:48px;border-radius:50%;object-fit:cover;background:var(--surface2);flex:none;border:2px solid var(--ochre-soft)}
.thumb.lg{width:66px;height:66px;border-radius:999px 999px 14px 14px}
.lcard{display:flex;gap:12px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:24px;padding:13px;box-shadow:var(--shadow-c);transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s}
button.lcard:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(120,86,50,.16)}
button.lcard:active{transform:scale(.98)}
.lcard .t{font-weight:800;font-size:14.5px}
.lcard .s{font-size:12.5px;color:var(--ink2)}
.lcard .r{text-align:right;flex:none}
.mini{display:flex}
.mini img{width:26px;height:26px;border-radius:50%;border:2px solid var(--surface);margin-right:-6px;object-fit:cover}
.alert{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border-radius:18px;font-size:13px;font-weight:600}
.alert.bad{background:var(--bad-soft);color:var(--bad)} .alert.warn{background:var(--warn-soft);color:var(--warn)} .alert.good{background:var(--good-soft);color:var(--good)}
.alert .ic{margin-top:1px}

/* страницы и шиты */
.page{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;z-index:20}
.page.anim{animation:slidein .32s cubic-bezier(.2,.8,.2,1)}
.page-top{display:flex;align-items:center;gap:10px;padding-top:12px;padding-bottom:10px;border-bottom:1.5px dashed var(--line);background:var(--bg)}
.pt-title{flex:1;min-width:0;display:flex;flex-direction:column}
.pt-title .ttl{font-family:var(--f-display);font-style:italic;font-weight:600;font-size:25px;line-height:1.05}
.title-in{border:0;background:transparent;outline:none;font-family:var(--f-display);font-style:italic;font-weight:600;font-size:25px;line-height:1.1;width:100%;min-width:0;padding:0}
.page-body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-top:14px;padding-bottom:26px}
.page-foot{padding-top:10px;padding-bottom:12px;background:var(--surface);display:flex;gap:10px;position:relative;box-shadow:0 -6px 18px rgba(120,86,50,.08)}
.page.anim .page-body>.stack>*{animation:floatin .5s cubic-bezier(.2,.8,.2,1) both}
.page.anim .page-body>.stack>*:nth-child(2){animation-delay:.05s}.page.anim .page-body>.stack>*:nth-child(3){animation-delay:.1s}.page.anim .page-body>.stack>*:nth-child(4){animation-delay:.15s}.page.anim .page-body>.stack>*:nth-child(5){animation-delay:.2s}.page.anim .page-body>.stack>*:nth-child(n+6){animation-delay:.25s}
.sheet-wrap{position:absolute;inset:0;z-index:40;display:flex;align-items:flex-end;background:var(--scrim);animation:fade .25s}
.sheet{width:100%;max-height:93%;display:flex;flex-direction:column;background:var(--bg);border-radius:32px 32px 0 0;box-shadow:var(--shadow)}
.sheet.anim{animation:rise .38s cubic-bezier(.2,1.1,.3,1)}
.sheet-h{display:flex;align-items:center;gap:10px;padding-top:8px;padding-bottom:6px;position:relative}
.sheet-h::before{content:"";position:absolute;top:7px;left:50%;width:40px;height:4px;border-radius:2px;background:var(--line);transform:translateX(-50%)}
.sheet-h h2{flex:1;font-family:var(--f-display);font-style:italic;font-weight:600;font-size:26px;line-height:1.1;padding-top:12px;min-width:0}
.sheet-h .ibtn{margin-top:12px}
.sheet-b{overflow-y:auto;padding-top:6px;padding-bottom:18px;display:flex;flex-direction:column;gap:14px}
.sheet-f{padding-top:10px;padding-bottom:14px;border-top:1.5px dashed var(--line);display:flex;gap:10px}
.toast{position:absolute;left:50%;bottom:92px;transform:translateX(-50%) translateY(10px);background:var(--btn);color:var(--btn-ink);padding:10px 18px;border-radius:18px;font-size:13.5px;font-weight:700;opacity:0;transition:opacity .25s,transform .35s cubic-bezier(.2,1.2,.3,1);pointer-events:none;z-index:90;max-width:88%;text-align:center;box-shadow:var(--shadow)}
.toast.on{opacity:1;transform:translateX(-50%)}

/* герой-фото в форме арки */
.bigph{position:relative;aspect-ratio:1/1;max-width:100%;border-radius:999px 999px 28px 28px;overflow:hidden;background:var(--surface2);border:3px solid var(--ochre-soft);box-shadow:var(--shadow-c)}
.bigph img{width:100%;height:100%;object-fit:cover}
.bigph .btn{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(6px)}
.bigph .btn:not([disabled]):active{transform:translateX(-50%) scale(.96)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:11px 12px}
.stat .v{font-weight:800;font-size:17px}
.stat .k{font-size:11.5px;color:var(--ink2)}
.hist{display:flex;flex-direction:column}
.hist .h{display:flex;gap:10px;justify-content:space-between;padding:8px 0;border-bottom:1.5px dashed var(--line);font-size:13px}
.pos{color:var(--good)} .neg{color:var(--bad)}

/* работа */
.part{background:var(--surface);border:1.5px solid var(--line);border-radius:24px;padding:13px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow-c)}
.part.bad{border-color:var(--bad)}
.part .hd{display:flex;gap:10px;align-items:center}
.part .nm{font-weight:800;font-size:14px;line-height:1.25}
.step{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:16px;background:var(--surface2);overflow:hidden;height:46px}
.step button{width:42px;height:100%;display:grid;place-items:center;color:var(--clay);flex:none;transition:background .15s}
.step button:active{background:var(--clay-soft)}
.step input{flex:1;min-width:0;width:100%;height:34px;text-align:center;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;font-weight:800;font-size:16px;outline:none;margin:0 2px}
.step input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.mstat{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.mstat>div{background:var(--surface2);border-radius:14px;padding:7px 9px;display:flex;flex-direction:column;min-width:0}
.mstat b{font-weight:800;font-size:13.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.mstat span{font-size:11px;color:var(--ink2);line-height:1.2}
.mstat .fr{background:var(--accent-soft)} .mstat .fr b,.mstat .fr span{color:var(--accent)}
.timer{display:flex;flex-direction:column;gap:12px}
.clock{font-family:var(--f-body);font-size:46px;font-weight:800;line-height:1;letter-spacing:.01em;font-variant-numeric:tabular-nums;color:var(--ink)}
.clock.run{color:var(--accent)}
.live{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--accent);margin-right:6px;animation:pulse 1.2s infinite}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:8px 0;border-bottom:1.5px dashed var(--line);font-size:14px}
.kv span{color:var(--ink2)} .kv b{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:800}
.kv.bad span,.kv.bad b{color:var(--bad)}
.kv.total{border-bottom:0;padding-top:12px} .kv.total span{color:var(--ink);font-weight:800} .kv.total b{font-size:21px}
.pricebox{background:var(--clay-soft);color:var(--clay);border-radius:22px;padding:14px 16px;display:flex;flex-direction:column;gap:3px;margin:6px 0;position:relative;overflow:hidden}
.pricebox::after{content:"";position:absolute;right:-18px;top:-18px;width:90px;height:90px;border-radius:50%;border:2px dashed var(--clay);opacity:.35;animation:spin 40s linear infinite}
.pricebox .big{font-family:var(--f-body);font-size:36px;font-weight:800;line-height:1.05;color:var(--ink);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.pricebox .big.pop{animation:popn .45s cubic-bezier(.2,1.4,.4,1)}
.photo-drop{border:2px dashed var(--line);border-radius:28px;min-height:150px;display:grid;place-items:center;text-align:center;overflow:hidden;background:var(--surface);color:var(--ink2)}
.photo-drop img{width:100%;aspect-ratio:1/1;object-fit:cover}
.lock{display:inline-flex;align-items:center;gap:6px;color:var(--ink2);font-size:12px}
.rl{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1.5px dashed var(--line)}
.rl:last-child{border-bottom:0}
.rl .a{flex:1;min-width:0}
.rl .a b{font-weight:800;font-size:13.5px}
.rl .a span{display:block;font-size:12px;color:var(--ink2)}
.rl .c{text-align:right;font-variant-numeric:tabular-nums;font-weight:800;font-size:13.5px;white-space:nowrap}
.rl .c small{display:block;font-weight:600;font-size:11.5px;color:var(--bad)}
textarea.json{width:100%;height:190px;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:10px;resize:vertical}
.check{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1.5px dashed var(--line);font-size:13px}
.check:last-child{border-bottom:0}
.check .ok{width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--good-soft);color:var(--good)}
.check .ok.no{background:var(--bad-soft);color:var(--bad)}
.check .ok .ic{width:14px;height:14px;stroke-width:2.4}
.check b{display:block;font-weight:800}
.check span{color:var(--ink2)}

/* кадрирование */
.cropframe{position:relative;width:100%;aspect-ratio:1/1;overflow:hidden;border-radius:26px;background:#2a2118;touch-action:none;cursor:grab;user-select:none;border:3px solid var(--ochre-soft)}
.cropframe:active{cursor:grabbing}
.cropframe img{position:absolute;max-width:none;pointer-events:none;-webkit-user-drag:none}
.cropframe::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(to right,transparent 33%,rgba(255,255,255,.45) 33%,rgba(255,255,255,.45) calc(33% + 1px),transparent calc(33% + 1px),transparent 66%,rgba(255,255,255,.45) 66%,rgba(255,255,255,.45) calc(66% + 1px),transparent calc(66% + 1px)),linear-gradient(to bottom,transparent 33%,rgba(255,255,255,.45) 33%,rgba(255,255,255,.45) calc(33% + 1px),transparent calc(33% + 1px),transparent 66%,rgba(255,255,255,.45) 66%,rgba(255,255,255,.45) calc(66% + 1px),transparent calc(66% + 1px))}
input[type=range]{width:100%;accent-color:var(--clay);height:28px}

/* статистика */
.bars{width:100%;height:auto;display:block;overflow:visible}
.bar{fill:var(--clay);transform-box:fill-box;transform-origin:50% 100%;animation:grow .8s cubic-bezier(.2,.9,.3,1) both;animation-delay:calc(var(--i)*22ms)}
.bar.z{fill:var(--line)}
.bars text{font-family:var(--f-body);font-size:9px;fill:var(--ink2);font-weight:700}
.hbar{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden;margin-top:5px}
.hbar i{display:block;height:100%;background:var(--accent);border-radius:4px;transform-origin:left;animation:growx .9s cubic-bezier(.2,.9,.3,1) both}
.big2{font-family:var(--f-body);font-weight:800;font-size:30px;line-height:1;letter-spacing:-.01em}

/* академия и чат */
.cover{position:relative;aspect-ratio:16/10;border-radius:999px 999px 26px 26px;overflow:hidden;border:3px solid var(--ochre-soft)}
.cover img{width:100%;height:100%;object-fit:cover}
.lesson{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 12px;background:var(--surface);border:1.5px solid var(--line);border-radius:20px;transition:transform .2s}
.lesson:active{transform:scale(.98)}
.lesson .n{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.video{aspect-ratio:16/9;border-radius:22px;background:linear-gradient(135deg,var(--accent),var(--btn));display:grid;place-items:center;color:#fff;position:relative;overflow:hidden}
.video .pbtn{width:62px;height:62px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;backdrop-filter:blur(4px);animation:pulse2 2.4s infinite}
.video .pbtn .ic{width:28px;height:28px}
.video small{position:absolute;left:12px;bottom:10px;font-weight:700;opacity:.9}
.msgs{display:flex;flex-direction:column;gap:9px}
.msg{max-width:82%;padding:9px 13px;border-radius:20px 20px 20px 6px;background:var(--surface);border:1.5px solid var(--line);font-size:14px;animation:floatin .35s both}
.msg .who{font-size:11.5px;font-weight:800;color:var(--accent);margin-bottom:2px}
.msg .tm{font-size:10.5px;color:var(--ink3);margin-top:3px;text-align:right}
.msg.me{align-self:flex-end;background:var(--clay-soft);border-color:transparent;border-radius:20px 20px 6px 20px}
.msg.me .who{color:var(--clay)}
.prog{height:7px;border-radius:4px;background:var(--surface2);overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--ochre));border-radius:4px;transition:width .5s}
.ava{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;flex:none;font-size:16px}

/* боковая панель */
.side h1{font-family:var(--f-display);font-style:italic;font-weight:600;font-size:46px;line-height:.95;letter-spacing:-.01em}
.side h1 em{color:var(--clay)}
.side .lead{margin:12px 0 20px;color:var(--ink2);font-size:14px;max-width:34ch}
.try{display:flex;flex-direction:column;gap:8px}
.try button{display:flex;gap:12px;text-align:left;padding:11px 13px;border:1.5px solid var(--line);background:var(--surface);border-radius:18px;align-items:flex-start;transition:transform .2s,border-color .2s}
.try button:hover{border-color:var(--clay);transform:translateX(3px)}
.try .n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--clay-soft);color:var(--clay);font-size:12px;font-weight:800;display:grid;place-items:center}
.try b{display:block;font-size:13.5px;font-weight:800}
.try span.t{font-size:12.5px;color:var(--ink2)}
.side .fine{margin-top:16px;font-size:12px;color:var(--ink3);max-width:38ch}

/* конфетти из листьев */
.spark{position:absolute;z-index:95;width:10px;height:15px;border-radius:60% 0 60% 0;pointer-events:none;animation:burst 1.25s cubic-bezier(.1,.7,.3,1) forwards}

@keyframes slidein{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
@keyframes rise{from{transform:translateY(60px);opacity:.3}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes floatin{from{transform:translateY(14px) scale(.98);opacity:0}to{transform:none;opacity:1}}
@keyframes popn{0%{transform:scale(.88);opacity:.4}60%{transform:scale(1.07)}100%{transform:none;opacity:1}}
@keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(-30px,40px) scale(1.15)}}
@keyframes bob{0%{transform:translateY(0)}40%{transform:translateY(-4px) scale(1.12)}100%{transform:none}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
@keyframes pulse2{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.35)}50%{box-shadow:0 0 0 14px rgba(255,255,255,0)}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes burst{0%{transform:translate(0,0) rotate(0) scale(.4);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(260deg) scale(1);opacity:0}}
.enter .mcard,.enter .lcard,.enter .card,.enter .stat,.enter .empty{animation:floatin .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*45ms)}
.enter .top{animation:floatin .5s both}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<script>
(() => {
'use strict';
/* ============================================================
   УТИЛИТЫ
============================================================ */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = p => p + '_' + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-3);
const r2 = n => Math.round((n + Number.EPSILON) * 100) / 100;
const nz = v => { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : 0; };
const ruCmp = (a, b) => a.localeCompare(b, 'ru');

/* валюты: можно выбрать любую из списка (в прототипе список короткий, в продукте будет полный ISO 4217) */
const CURS = [['TRY','₺','Турецкая лира'],['USD','$','Доллар США'],['EUR','€','Евро'],['RUB','₽','Российский рубль'],['UAH','₴','Украинская гривна'],['KZT','₸','Казахстанский тенге'],['BYN','Br','Белорусский рубль'],['GEL','₾','Грузинский лари'],['AMD','֏','Армянский драм'],['AZN','₼','Азербайджанский манат'],['UZS','soʻm','Узбекский сум'],['KGS','с','Киргизский сом'],['MDL','L','Молдавский лей'],['PLN','zł','Польский злотый'],['CZK','Kč','Чешская крона'],['HUF','Ft','Венгерский форинт'],['RON','lei','Румынский лей'],['BGN','лв','Болгарский лев'],['RSD','дин','Сербский динар'],['GBP','£','Фунт стерлингов'],['CHF','CHF','Швейцарский франк'],['SEK','kr','Шведская крона'],['NOK','kr','Норвежская крона'],['DKK','kr','Датская крона'],['AED','AED','Дирхам ОАЭ'],['SAR','SAR','Саудовский риял'],['ILS','₪','Израильский шекель'],['EGP','E£','Египетский фунт'],['MAD','MAD','Марокканский дирхам'],['ZAR','R','Южноафриканский рэнд'],['INR','₹','Индийская рупия'],['CNY','¥','Китайский юань'],['JPY','¥','Японская иена'],['KRW','₩','Корейская вона'],['THB','฿','Тайский бат'],['VND','₫','Вьетнамский донг'],['IDR','Rp','Индонезийская рупия'],['MYR','RM','Малайзийский ринггит'],['SGD','S$','Сингапурский доллар'],['AUD','A$','Австралийский доллар'],['CAD','C$','Канадский доллар'],['MXN','Mex$','Мексиканское песо'],['BRL','R$','Бразильский реал']];
const curInfo = c => CURS.find(x => x[0] === c) || [c, c, c];
const base = () => (typeof S !== 'undefined' && S && S.settings && S.settings.base) || 'TRY';
const sym = () => curInfo(base())[1];
const money = n => (isFinite(n) ? r2(n) : 0).toLocaleString('ru-RU', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + ' ' + sym();
const num = n => Number(r2(n)).toLocaleString('ru-RU', {maximumFractionDigits: 2});
const nv = v => (v ? String(v).replace('.', ',') : '');
const MON = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
const MONF = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const todayISO = () => new Date().toISOString().slice(0, 10);

function migrate(st) {
  const b = blankState();
  Object.keys(b).forEach(k => { if (st[k] == null) st[k] = b[k]; });
  st.settings = Object.assign({}, b.settings, st.settings); st.settings.fx = Object.assign({}, b.settings.fx, st.settings.fx || {});
  st.academy = Object.assign({}, b.academy, st.academy || {});
  st.materials = st.materials.map(m => makeMat(m));
  st.categories = [...new Set(st.categories.concat(st.materials.map(m => m.category)))].sort(ruCmp);
  st.drafts.forEach(d => { d.parts = (d.parts || []).map(p => ({id: p.id, used: +p.used || 0, scrap: +p.scrap || 0}));
    ['hourly','other','fee','margin','shipping','sale','elapsedMs','manualMinutes'].forEach(k => { d[k] = +d[k] || (k === 'hourly' ? st.settings.hourly : 0); });
    d.notes = d.notes || ''; d.runningSince = d.runningSince || null; d.category = d.category || 'Другое'; });
  st.finished.forEach(f => { f.category = f.category || 'Другое'; f.sale = f.sale || null; });
  st.v = 3; return st;
}

/* фото: выбор файла → кадрирование (центр и масштаб) */
function pickPhoto(cb) {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*'; inp.style.display = 'none'; document.body.appendChild(inp);
  inp.onchange = () => { const f = inp.files && inp.files[0]; inp.remove(); if (!f) return;
    const rd = new FileReader(); rd.onload = () => { const img = new Image();
      img.onload = () => { const k = Math.min(1, 1600 / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); openCrop(c.toDataURL('image/jpeg', .9), null, cb); };
      img.onerror = () => toast('Не удалось прочитать фото'); img.src = rd.result; };
    rd.readAsDataURL(f); };
  inp.click();
}
function openCrop(src, params, cb) {
  const img = new Image();
  img.onload = () => { ui.crop = Object.assign({src, img, w: img.naturalWidth, h: img.naturalHeight, cx: .5, cy: .5, zoom: 1, cb}, params || {}); pushSheet({type: 'crop'}); };
  img.onerror = () => toast('Не удалось открыть фото'); img.src = src;
}
function cropClamp(c, F) { const s = Math.max(F / c.w, F / c.h) * c.zoom, hx = F / (2 * c.w * s), hy = F / (2 * c.h * s); c.cx = Math.min(1 - hx, Math.max(hx, c.cx)); c.cy = Math.min(1 - hy, Math.max(hy, c.cy)); return s; }
function cropApply() {
  const c = ui.crop, f = $('#cropFrame'), im = $('#cropImg'); if (!c || !f || !im) return;
  const F = f.clientWidth, s = cropClamp(c, F);
  im.style.width = c.w * s + 'px'; im.style.height = c.h * s + 'px'; im.style.left = (F / 2 - c.cx * c.w * s) + 'px'; im.style.top = (F / 2 - c.cy * c.h * s) + 'px';
  const z = $('#cropZoom'); if (z) z.value = c.zoom;
}
function cropBind() {
  const f = $('#cropFrame'); if (!f) return; const ptrs = new Map(); let last = 0;
  f.onpointerdown = e => { f.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, {x: e.clientX, y: e.clientY}); last = 0; };
  f.onpointermove = e => {
    if (!ptrs.has(e.pointerId)) return; const p = ptrs.get(e.pointerId), c = ui.crop, F = f.clientWidth, s = Math.max(F / c.w, F / c.h) * c.zoom;
    if (ptrs.size === 1) { c.cx -= (e.clientX - p.x) / (c.w * s); c.cy -= (e.clientY - p.y) / (c.h * s); }
    p.x = e.clientX; p.y = e.clientY;
    if (ptrs.size === 2) { const [a, b] = [...ptrs.values()], d = Math.hypot(a.x - b.x, a.y - b.y); if (last) c.zoom = Math.min(4, Math.max(1, c.zoom * d / last)); last = d; }
    cropApply();
  };
  f.onpointerup = f.onpointercancel = e => { ptrs.delete(e.pointerId); last = 0; };
  f.onwheel = e => { e.preventDefault(); ui.crop.zoom = Math.min(4, Math.max(1, ui.crop.zoom * (e.deltaY < 0 ? 1.08 : .93))); cropApply(); };
  const im = $('#cropImg'); if (im.complete) cropApply(); else im.onload = cropApply;
  requestAnimationFrame(cropApply);
}

function stockFilter() {
  const toks = ui.q.toLowerCase().split(/\s+/).filter(Boolean);
  return S.materials.filter(m => {
    if (ui.cat !== 'all' && m.category !== ui.cat) return false;
    if (ui.sub !== 'all' && m.subcategory !== ui.sub) return false;
    if (!toks.length) return true;
    const h = [m.name, m.brand, m.category, m.subcategory, m.sku, m.color, m.size].join(' ').toLowerCase();
    return toks.every(t => h.includes(t));
  }).sort((a, b) => ruCmp(a.category, b.category) || ruCmp(a.name, b.name));
}

  if (!list.length) return `<div class="empty"><b>${S.materials.length ? 'Ничего не нашла' : 'Склад пока пуст'}</b>
    <span>${ui.q ? 'Попробуй другой запрос: название, бренд, артикул, цвет или размер.' : ui.cat !== 'all' ? 'В этой категории пока пусто. Материалы появятся после закупки.' : 'Материалы появляются здесь после закупки.'}</span>
    ${ui.q || ui.cat !== 'all' ? '<button class="btn sm" data-act="clearFilters">Сбросить фильтры</button>' : '<button class="btn sm pri" data-act="newPurchase">Оформить закупку</button>'}</div>`;
  return `<div class="grid">${list.map((m, i) => mcard(m, 'openMat', false, i)).join('')}</div>`;
}
function stockChipsHTML() {
  const cnt = c => S.materials.filter(m => m.category === c).length;
  const subs = ui.cat === 'all' ? [] : [...new Set(S.materials.filter(m => m.category === ui.cat && m.subcategory).map(m => m.subcategory))].sort(ruCmp);
  return `<div class="chips px" id="catChips" role="tablist">
      <button class="chip ${ui.cat === 'all' ? 'on' : ''}" data-act="setCat" data-v="all">Все <small>${S.materials.length}</small></button>
      ${S.categories.map(c => `<button class="chip ${ui.cat === c ? 'on' : ''}" data-act="setCat" data-v="${esc(c)}">${esc(c)} <small>${cnt(c)}</small></button>`).join('')}
    </div>
    ${subs.length ? `<div class="chips px" style="padding-top:6px"><button class="chip sub ${ui.sub === 'all' ? 'on' : ''}" data-act="setSub" data-v="all">Все</button>${subs.map(s => `<button class="chip sub ${ui.sub === s ? 'on' : ''}" data-act="setSub" data-v="${esc(s)}">${esc(s)}</button>`).join('')}</div>` : ''}`;
}
function stockScreen() {
  const value = S.materials.reduce((s, m) => s + m.qty * m.avg, 0), low = S.materials.filter(m => m.min > 0 && m.qty <= m.min).length;
  return `<header class="top px"><div><span class="kick">твои сокровища</span><h1>Фото-склад</h1><p class="sub num">${S.materials.length} ${pl(S.materials.length, ['позиция','позиции','позиций'])} · на ${money(value)}${low ? ` · мало: ${low}` : ''}</p></div>
      <div class="row"><button class="ibtn" data-act="catMgr" aria-label="Категории">${ic('folder')}</button><button class="ibtn fill" data-act="newPurchase" aria-label="Новая закупка">${ic('plus')}</button></div></header>
    <div class="px"><label class="search">${ic('search')}<input id="q" data-m="ui.q" type="search" autocomplete="off" placeholder="Название, бренд, артикул, цвет, размер" value="${esc(ui.q)}"><button class="ibtn sm" id="qClear" data-act="clearQ" aria-label="Очистить" style="border:0;background:transparent" ${ui.q ? '' : 'hidden'}>${ic('x', 'sm')}</button></label></div>
    <div id="stockChips">${stockChipsHTML()}</div>
    <div class="px" id="stockList">${stockListHTML()}</div>`;
}
function refreshStock() { const l = $('#stockList'); if (l) l.innerHTML = stockListHTML(); const c = $('#qClear'); if (c) c.hidden = !ui.q; }

  const pd = pfHas(S.pfDraft) ? S.pfDraft : null;
  return `<header class="top px"><div><span class="kick">приход материалов</span><h1>Закупки</h1><p class="sub">${list.length} ${pl(list.length, ['закупка','закупки','закупок'])} · приход сам попадает на склад</p></div></header>
    <div class="px stack">
      ${pd ? `<div class="card" style="border-color:var(--ochre);background:var(--ochre-soft)"><div style="font-weight:800">Незавершённая закупка</div><div class="hint" style="color:var(--ink2)">${esc(pd.supplier || 'без поставщика')} · ${pd.lines.length} ${pl(pd.lines.length, ['позиция','позиции','позиций'])}. Всё сохранено.</div>
        <div class="two" style="margin-top:10px"><button class="btn pri sm" data-act="newPurchase">Продолжить</button><button class="btn sm" data-act="pfClear">Удалить</button></div></div>`
        : `<button class="btn pri block" data-act="newPurchase">${ic('plus')} Новая закупка</button>`}
      ${list.length ? list.map((p, i) => { const imgs = p.lines.slice(0, 4).map(l => `<img src="${photoOf(mat(S, l.materialId))}" alt="">`).join('');
        return `<button class="lcard" style="--i:${i}" data-act="openPurchase" data-id="${p.id}"><div class="grow"><div class="t">${esc(p.supplier || 'Без поставщика')}</div><div class="s">${fmtDate(p.date)} · ${p.lines.length} ${pl(p.lines.length, ['позиция','позиции','позиций'])}${p.currency !== base() ? ' · ' + p.currency + ' × ' + num(p.fx) : ''}</div><div class="mini" style="margin-top:8px">${imgs}</div></div>
          <div class="r"><div class="t num">${money(purchaseTotal(p))}</div><div class="s">с доставкой</div></div></button>`; }).join('')
        : `<div class="empty"><b>Закупок ещё нет</b><span>Добавь первую: фото, количество и цена. Склад пополнится автоматически.</span></div>`}
    </div>`;
}

============================================================ */
function workScreen() {

    <div class="px stack">
      <button class="btn pri block" data-act="newWork">${ic('plus')} Новая работа</button>
      ${ds.length ? ds.map((d, i) => { const t = draftTotals(S, d), thumbs = d.parts.slice(0, 5).map(p => `<img src="${photoOf(mat(S, p.id))}" alt="">`).join('');
        const run = !!d.runningSince, errs = validateDraft(S, d).length;
        return `<button class="lcard" style="--i:${i};align-items:flex-start" data-act="openDraft" data-id="${d.id}"><div class="grow">

          <div class="s">${esc(d.category)} · ${d.parts.length} ${pl(d.parts.length, ['материал','материала','материалов'])} · ${fmtMin(t.minutes)}</div>
          <div class="mini" style="margin-top:8px">${thumbs}</div></div>
          <div class="r"><div class="t num">${money(t.cost)}</div><div class="s">себестоимость</div></div></button>`; }).join('')
        : `<div class="empty"><b>Нет активных работ</b><span>Начни с нуля или возьми сохранённый дизайн.</span></div>`}
      <div class="sect"><h2>Сохранённые дизайны</h2></div>
      ${S.products.map((p, i) => `<button class="lcard" style="--i:${i}" data-act="startTpl" data-id="${p.id}"><img class="thumb" src="${p.photo}" alt=""><div class="grow"><div class="t">${esc(p.name)}</div><div class="s">${p.bom.length} ${pl(p.bom.length, ['материал','материала','материалов'])} по рецепту</div></div>${ic('chev')}</button>`).join('')}

function stepper(i, f, v) {
  return `<div class="step"><button data-act="stp" data-i="${i}" data-f="${f}" data-d="-1" aria-label="Меньше">${ic('minus')}</button>
    <input inputmode="decimal" data-part="${i}" data-f="${f}" value="${fmtInput(v)}" aria-label="${f === 'used' ? 'В изделии' : 'Брак'}">
    <button data-act="stp" data-i="${i}" data-f="${f}" data-d="1" aria-label="Больше">${ic('plus')}</button></div>`;
}
function partHTML(d, p, i) {
  const m = mat(S, p.id); if (!m) return '';
  const {others, max} = partLimits(S, d, p), tool = isTool(m), U = esc(m.unit);
  const over = tool ? (p.scrap > max + 1e-9 || (p.used > 0 && m.qty < 1)) : (p.used + p.scrap > max + 1e-9);
  const c = partCost(m, p), own = tool ? p.scrap : p.used + p.scrap, resAll = reservedBy(S, m.id), free = m.qty - resAll, after = m.qty - own;
  const info = tool
    ? `<div class="mstat"><div><b>${num(m.qty)} шт</b><span>на складе</span></div><div><b>${num(p.used)} × ${num(m.useCost)} ${sym()}</b><span>применения</span></div><div class="fr"><b>${money(c.tool)}</b><span>в себестоимость</span></div></div>
       <p class="hint">Стоимость применения — это износ инструмента: цена ÷ на сколько раз его хватит. Ты задаёшь её сама в карточке инструмента.</p>`
    : `<div class="mstat"><div><b>${num(m.qty)} ${U}</b><span>на складе</span></div><div><b>${num(resAll)} ${U}</b><span>в резерве всех работ</span></div><div class="fr"><b>${num(free)} ${U}</b><span>свободно</span></div></div>
       <p class="hint">${others ? `В этой работе ${num(own)}, в других ${num(others)}. ` : ''}Когда завершишь эту работу, на складе останется ${num(after)} ${U}${others ? ' (резерв других работ ещё не списан)' : ''}.</p>`;
  return `<div class="part ${over ? 'bad' : ''}">
    <div class="hd"><img class="thumb" src="${photoOf(m)}" alt=""><div class="grow"><div class="nm">${esc(m.name)}</div>
      <div class="hint">${esc([m.size, m.color].filter(Boolean).join(' · ')) || '&nbsp;'} ${tool ? '<span class="pill acc">инструмент</span>' : ''}</div></div>
      <button class="ibtn sm" data-act="partSwap" data-i="${i}" aria-label="Заменить материал">${ic('swap', 'sm')}</button>
      <button class="ibtn sm" data-act="partDel" data-i="${i}" aria-label="Убрать материал" title="Убрать и вернуть в свободный остаток">${ic('trash', 'sm')}</button></div>
    <div class="two"><div class="fld"><span class="lbl">${tool ? 'Применений' : 'В изделии, ' + U}</span>${stepper(i, 'used', p.used)}</div>
      <div class="fld"><span class="lbl">${tool ? 'Поломка, шт' : 'Брак / потери, ' + U}</span>${stepper(i, 'scrap', p.scrap)}</div></div>
    ${m.unit !== 'шт' ? '<p class="hint">Число можно вписать руками, например 1,25.</p>' : ''}
    ${info}
    <div class="row" style="justify-content:space-between"><span class="hint">Стоимость в работе</span><b class="num">${money(c.total)}</b></div></div>`;
}
function errHTML(d) { const e = validateDraft(S, d); return e.length ? `<div class="alert bad">${ic('alert')}<div>${e.map(esc).join('<br>')}</div></div>` : ''; }
function totalsHTML(d) {
  const t = draftTotals(S, d);
  return `<div class="kv"><span>Материалы в изделии</span><b>${money(t.matIn)}</b></div>
    ${t.toolUse > 0 ? `<div class="kv"><span>Инструмент (применения)</span><b>${money(t.toolUse)}</b></div>` : ''}
    <div class="kv bad"><span>Брак и потери (отдельно)</span><b>${money(t.scrapC)}</b></div>
    <div class="kv"><span>Труд: ${fmtMin(t.minutes)} × ${money(d.hourly)}/ч</span><b>${money(t.labor)}</b></div>
    <div class="kv"><span>Прочие расходы</span><b>${money(t.other)}</b></div>
    <div class="kv total"><span>Себестоимость</span><b>${money(t.cost)}</b></div>
    <div class="pricebox"><span class="lbl" style="color:var(--clay)">Рекомендуемая цена</span><div class="big">${t.blocked ? '—' : money(t.suggested)}</div>
      <span class="hint" style="color:var(--clay)">(себестоимость + доставка) ÷ (1 − комиссия − прибыль)</span></div>
    ${t.blocked ? `<div class="alert bad">${ic('alert')}<div>Комиссия + прибыль ≥ 99%. Уменьши проценты, иначе цену не посчитать.</div></div>` : ''}
    <div class="kv"><span>Цена продажи ${d.sale > 0 ? '(твоя)' : '(рекомендуемая)'}</span><b>${isFinite(t.price) ? money(t.price) : '—'}</b></div>
    <div class="kv" style="border-bottom:0"><span>Прибыль после комиссии и доставки</span><b class="${t.profit < 0 ? 'neg' : 'pos'}">${isFinite(t.profit) ? money(t.profit) + ' · ' + t.profitPct + '%' : '—'}</b></div>`;
}
function timeUsedText(d) { const t = draftTotals(S, d); return `${fmtMin(t.minutes)} · ${t.manual ? 'вручную' : 'по таймеру'}`; }
function pageDraft(d) {
  const running = !!d.runningSince, errs = validateDraft(S, d);
  const ms = d.elapsedMs + (running ? Date.now() - d.runningSince : 0);
  return `<div class="page-top px"><button class="ibtn" data-act="back" aria-label="Назад">${ic('back')}</button>
      <div class="pt-title"><input class="title-in" data-m="D.name" value="${esc(d.name)}" aria-label="Название работы"><span class="sub">${esc(d.category)} · черновик сохраняется сам</span></div>
      <button class="ibtn" data-act="draftCancel" aria-label="Отменить работу">${ic('trash')}</button></div>
    <div class="page-body px" id="pageBody"><div class="stack">
      <div id="errBox">${errHTML(d)}</div>
      <div class="card timer">
        <div class="row" style="justify-content:space-between"><span class="lbl">Время работы</span><span class="pill ${running ? 'good' : ''}" id="timeUsed">${timeUsedText(d)}</span></div>
        <div class="clock ${running ? 'run' : ''}" id="clock">${fmtClock(ms)}</div>
        <div class="two"><button class="btn ${running ? '' : 'acc'}" data-act="timerToggle">${running ? ic('pause') + ' Пауза' : ic('play') + ' Старт'}</button>
          <div class="fld"><label class="lbl" for="manMin">Вручную, мин</label><input id="manMin" class="in" inputmode="decimal" data-m="D.manualMinutes" data-num value="${nv(d.manualMinutes)}" placeholder="например, 60"></div></div>
        <p class="hint">Если время указано вручную, считаем его. Оно главнее таймера.</p></div>
      <div><div class="sect"><h2>Материалы</h2><button class="btn sm" data-act="addPart">${ic('plus', 'sm')} Из склада</button></div></div>
      ${d.parts.length ? d.parts.map((p, i) => partHTML(d, p, i)).join('') : `<div class="empty"><b>Пока пусто</b><span>Добавь материалы из фото-склада.</span><button class="btn sm pri" data-act="addPart">Выбрать материалы</button></div>`}
      <div><div class="sect"><h2>Цена</h2></div></div>
      <div class="card stack" style="gap:12px">
        <div class="two"><div class="fld"><label class="lbl" for="f_h">Ставка, ${sym()}/час</label><input id="f_h" class="in" inputmode="decimal" data-m="D.hourly" data-num value="${nv(d.hourly)}"></div>
          <div class="fld"><label class="lbl" for="f_o">Прочие расходы, ${sym()}</label><input id="f_o" class="in" inputmode="decimal" data-m="D.other" data-num value="${nv(d.other)}"></div></div>
        <div class="three"><div class="fld"><label class="lbl" for="f_f">Комиссия, %</label><input id="f_f" class="in" inputmode="decimal" data-m="D.fee" data-num value="${nv(d.fee)}"></div>
          <div class="fld"><label class="lbl" for="f_m">Прибыль, %</label><input id="f_m" class="in" inputmode="decimal" data-m="D.margin" data-num value="${nv(d.margin)}"></div>
          <div class="fld"><label class="lbl" for="f_s">Доставка, ${sym()}</label><input id="f_s" class="in" inputmode="decimal" data-m="D.shipping" data-num value="${nv(d.shipping)}"></div></div>
        <div class="fld"><label class="lbl" for="f_p">Своя цена продажи, ${sym()} (необязательно)</label><input id="f_p" class="in" inputmode="decimal" data-m="D.sale" data-num value="${nv(d.sale)}" placeholder="оставь пустой: возьмём рекомендуемую"></div>
        <div id="totals">${totalsHTML(d)}</div></div>
      <div class="fld"><label class="lbl" for="f_n">Заметки к работе</label><textarea id="f_n" class="in ta" data-m="D.notes" placeholder="Что важно запомнить">${esc(d.notes)}</textarea></div>
    </div></div>
    <div class="page-foot px"><button class="btn pri block" id="toFinish" data-act="toFinish" ${errs.length ? 'disabled' : ''}>Завершить работу ${ic('chev')}</button></div>`;
}
function refreshDraft(pop) {
  const d = curDraft(); if (!d) return;
  const set = (id, h) => { const e = $(id); if (e) e.innerHTML = h; };
  set('#totals', totalsHTML(d)); set('#errBox', errHTML(d));
  const tu = $('#timeUsed'); if (tu) tu.textContent = timeUsedText(d);
  const fb = $('#toFinish'); if (fb) fb.disabled = validateDraft(S, d).length > 0;
  if (pop) { const b = $('#totals .big'); if (b) b.classList.add('pop'); }
}
function pageFinish(d) {
  const t = draftTotals(S, d), errs = validateDraft(S, d), f = ui.fin;
  const rows = d.parts.map(p => { const m = mat(S, p.id); if (!m) return '';
    const out = isTool(m) ? p.scrap : p.used + p.scrap;
    return `<div class="rl"><img class="thumb" src="${photoOf(m)}" alt=""><div class="a"><b>${esc(m.name)}</b><span class="num">${isTool(m) ? `${num(p.used)} примен. · поломок ${num(p.scrap)}` : `в изделии ${num(p.used)} · брак ${num(p.scrap)}`}</span></div>
      <div class="c">${out > 0 ? '−' + num(out) + ' ' + esc(m.unit) : 'остаток не меняется'}<small style="color:var(--ink2)">останется ${num(m.qty - out)} ${esc(m.unit)}</small></div></div>`; }).join('');
  return `<div class="page-top px"><button class="ibtn" data-act="back" aria-label="Назад">${ic('back')}</button><div class="pt-title"><span class="ttl">Завершение</span><span class="sub">${esc(d.name)}</span></div></div>
    <div class="page-body px"><div class="stack">
      ${errs.length ? `<div class="alert bad">${ic('alert')}<div>${errs.map(esc).join('<br>')}</div></div>` : `<div class="alert good">${ic('check')}<div>Остатки сверены, всё хватает.</div></div>`}
      <div class="card"><div class="sect" style="padding-top:0"><h2>Спишется со склада</h2></div>${rows}</div>
      <div class="card"><div class="kv"><span>Материалы + инструмент</span><b>${money(t.matIn + t.toolUse)}</b></div>
        <div class="kv bad"><span>Затраты на брак</span><b>${money(t.scrapC)}</b></div>
        <div class="kv"><span>Труд, ${fmtMin(t.minutes)}</span><b>${money(t.labor)}</b></div>
        <div class="kv"><span>Прочее</span><b>${money(t.other)}</b></div>
        <div class="kv total"><span>Себестоимость</span><b>${money(t.cost)}</b></div>
        <p class="lock">${ic('lock', 'sm')} Цены расхода заморозятся и не изменятся задним числом.</p></div>
      <div><div class="sect"><h2>Фото результата</h2></div></div>
      <div class="photo-drop">${f.photo ? `<img src="${f.photo}" alt="Фото готового изделия">` : `<div class="stack" style="align-items:center;gap:6px;padding:20px">${ic('camera')}<span style="font-weight:700">Загрузи фото готового изделия</span><span class="hint">Потом сможешь подвинуть кадр и приблизить. Фото можно добавить и позже.</span></div>`}</div>
      ${f.photo ? `<div class="two"><button class="btn" data-act="finReframe">${ic('focus')} Изменить кадр</button><button class="btn" data-act="finPhoto">${ic('upload')} Другое фото</button></div>`
        : `<button class="btn block" data-act="finPhoto">${ic('upload')} Загрузить фото</button>`}
      <div class="fld"><label class="lbl" for="fin_note">Комментарий (по желанию)</label><textarea id="fin_note" class="in ta" data-m="ui.fin.note" placeholder="Для кого, что получилось, что улучшить">${esc(f.note)}</textarea></div>
    </div></div>
    <div class="page-foot px"><button class="btn acc block" data-act="finConfirm" ${errs.length ? 'disabled' : ''}>${ic('check')} Подтвердить и списать</button></div>`;
}

/* ============================================================

function archScreen() {
  const seg = ui.archSeg, stock = S.finished.filter(f => f.status === 'stock').length;
  let body;
  if (seg === 'runs') {
    body = S.runs.length ? S.runs.map((r, i) => `<button class="lcard" style="--i:${Math.min(i, 10)}" data-act="openRun" data-id="${r.id}"><img class="thumb lg" src="${r.photo || placeholder(r.name)}" alt="">
      <div class="grow"><div class="t">${esc(r.name)}</div><div class="s">${fmtDate(r.date)} · ${fmtMin(r.laborMinutes)}</div>
        ${r.scrapCost > 0 ? `<div class="s" style="color:var(--bad)">брак ${money(r.scrapCost)}</div>` : ''}</div>
      <div class="r"><div class="t num">${money(r.costTotal)}</div><div class="s num">цена ${money(r.plannedPrice)}</div></div></button>`).join('')

function barsSVG(vals, labels, showAll) {

  vals.forEach((v, i) => {
    const x = i * (bw + gap), h = v > 0 ? Math.max(4, v / max * 88) : 3, y = base0 - h;
    out += `<rect class="bar ${v > 0 ? '' : 'z'}" style="--i:${i}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="${Math.min(4, bw / 2).toFixed(1)}"/>`;
    if (v > 0 && (showAll || v === max)) { const cx = x + bw / 2, anchor = cx < 16 ? 'start' : cx > W - 16 ? 'end' : 'middle'; out += `<text x="${(anchor === 'start' ? x : anchor === 'end' ? x + bw : cx).toFixed(1)}" y="${(y - 4).toFixed(1)}" text-anchor="${anchor}">${short(v)}</text>`; }
    if (labels[i]) out += `<text x="${(x + bw / 2).toFixed(1)}" y="128" text-anchor="middle">${labels[i]}</text>`;
  });
  return out + '</svg>';
}

  return `<header class="top px"><div><span class="kick">делимся мастерством</span><h1>Академия</h1><p class="sub">${cs.length} ${pl(cs.length, ['курс','курса','курсов'])} · ${AC().students.length} ${pl(AC().students.length, ['ученица','ученицы','учениц'])}</p></div></header>
    <div class="px stack">
      <div class="card"><div class="row" style="justify-content:space-between;align-items:flex-start"><div><div class="lbl">Доход от курсов, ${MONF[m - 1].toLowerCase()}</div><div class="big2 num">${money(incomeIn(y, m))}</div></div><div style="text-align:right"><div class="lbl">За ${y} год</div><b class="num">${money(incomeIn(y, null))}</b></div></div>
        <p class="hint" style="margin-top:8px">Оплату ты принимаешь на своей платформе. Здесь отмечаешь, кто купил и открыт ли доступ.</p></div>
      <button class="btn pri block" data-act="newCourse">${ic('plus')} Новый курс</button>
      ${cs.map((c, i) => `<button class="lcard" style="--i:${i}" data-act="openCourse" data-id="${c.id}"><img class="thumb lg" src="${art(c.kind, c.hex)}" alt="">
        <div class="grow"><div class="t">${esc(c.title)}</div><div class="s">${c.lessons.length} ${pl(c.lessons.length, ['урок','урока','уроков'])} · ${studentsOf(c.id).length} ${pl(studentsOf(c.id).length, ['ученица','ученицы','учениц'])}</div><div style="margin-top:6px"><span class="pill ${c.status === 'pub' ? 'good' : ''}">${c.status === 'pub' ? 'опубликован' : 'черновик'}</span></div></div>
        <div class="r"><div class="t num">${money(c.price)}</div></div></button>`).join('')}
    </div>`;
}
function chatListScreen() {
  const cs = AC().courses;
  return `<header class="top px"><div><span class="kick">общаемся</span><h1>Чаты курсов</h1><p class="sub">Один общий чат на каждый курс</p></div></header>
    <div class="px stack">${cs.map((c, i) => { const msgs = AC().chats[c.id] || [], last = msgs[msgs.length - 1];
      return `<button class="lcard" style="--i:${i}" data-act="openChat" data-id="${c.id}"><span class="ava" style="background:${AVA[i % AVA.length]}">${ic('chat')}</span><div class="grow"><div class="t">${esc(c.title)}</div><div class="s" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${last ? esc(last.text) : 'Сообщений пока нет'}</div></div><div class="r"><span class="pill">${studentsOf(c.id).length}</span></div></button>`; }).join('')}
      <p class="hint">Личные сообщения ученицам не нужны на старте: общий чат курса проще вести и модерировать.</p></div>`;
}
function studentsScreen() {
  const ss = AC().students.slice().sort((a, b) => b.joined.localeCompare(a.joined));
  return `<header class="top px"><div><span class="kick">твои ученицы</span><h1>Ученицы</h1><p class="sub">${ss.length} ${pl(ss.length, ['человек','человека','человек'])} купили курсы</p></div></header>
    <div class="px stack"><button class="btn pri block" data-act="addStudent">${ic('plus')} Добавить ученицу</button>
      ${ss.map((s, i) => { const tot = s.enrolls.reduce((a, e) => a + (courseById(e.courseId) ? courseById(e.courseId).lessons.length : 0), 0), done = s.enrolls.reduce((a, e) => a + e.done.length, 0), pct = tot ? Math.round(done / tot * 100) : 0;
        return `<button class="lcard" style="--i:${i}" data-act="openStudent" data-id="${s.id}"><span class="ava" style="background:${AVA[i % AVA.length]}">${esc(s.name[0])}</span><div class="grow"><div class="t">${esc(s.name)}</div><div class="s">${s.enrolls.length} ${pl(s.enrolls.length, ['курс','курса','курсов'])} · с ${fmtDate(s.joined)}</div><div class="prog" style="margin-top:7px"><i style="width:${pct}%"></i></div></div><div class="r"><b class="num">${pct}%</b></div></button>`; }).join('')}</div>`;
}
function pageCourse(c) {
  const sts = studentsOf(c.id);
  return `<div class="page-top px"><button class="ibtn" data-act="back" aria-label="Назад">${ic('back')}</button><div class="pt-title"><input class="title-in" data-m="C.title" value="${esc(c.title)}" aria-label="Название курса"><span class="sub">${c.status === 'pub' ? 'опубликован' : 'черновик'} · ${c.lessons.length} ${pl(c.lessons.length, ['урок','урока','уроков'])}</span></div><button class="ibtn" data-act="courseDel" aria-label="Удалить курс">${ic('trash')}</button></div>
    <div class="page-body px"><div class="stack">
      <div class="cover"><img src="${art(c.kind, c.hex)}" alt=""></div>
      <div class="two"><div class="fld"><label class="lbl" for="c_p">Цена, ${sym()}</label><input id="c_p" class="in" inputmode="decimal" data-m="C.price" data-num value="${nv(c.price)}"></div>
        <div class="fld"><span class="lbl">Статус</span><div class="seg"><button class="${c.status === 'draft' ? 'on' : ''}" data-act="courseStatus" data-v="draft">Черновик</button><button class="${c.status === 'pub' ? 'on' : ''}" data-act="courseStatus" data-v="pub">Открыт</button></div></div></div>
      <div class="fld"><label class="lbl" for="c_d">О курсе</label><textarea id="c_d" class="in ta" data-m="C.desc">${esc(c.desc)}</textarea></div>
      <div><div class="sect"><h2>Уроки</h2><button class="btn sm" data-act="addLesson">${ic('plus', 'sm')} Урок</button></div></div>
      ${c.lessons.length ? c.lessons.map((l, i) => `<button class="lesson" data-act="openLesson" data-id="${l.id}"><span class="n">${i + 1}</span><div class="grow"><div style="font-weight:800;font-size:14px">${esc(l.title)}</div><div class="hint">${l.min} мин${l.bom.length ? ' · материалов: ' + l.bom.length : ''}</div></div>${l.free ? '<span class="pill good">бесплатно</span>' : ''}${ic('play', 'sm')}</button>`).join('')
        : `<div class="empty"><b>Уроков пока нет</b><span>Добавь первый: название, ссылка на видео и материалы.</span></div>`}
      <div><div class="sect"><h2>Ученицы</h2><button class="btn sm" data-act="addStudent">${ic('plus', 'sm')} Добавить</button></div></div>
      <div class="card">${sts.length ? sts.map(s => `<button class="rl" style="width:100%;text-align:left" data-act="openStudent" data-id="${s.id}"><span class="ava" style="background:${AVA[AC().students.indexOf(s) % AVA.length]};width:34px;height:34px;font-size:14px">${esc(s.name[0])}</span><div class="a"><b>${esc(s.name)}</b><span>${esc(s.contact)}</span></div>${ic('chev', 'sm')}</button>`).join('') : '<p class="hint">Пока никто не купил.</p>'}</div>
      <button class="btn block" data-act="openChat" data-id="${c.id}">${ic('chat')} Открыть чат курса</button>
    </div></div>`;
}
function pageChat(c) {
  const msgs = AC().chats[c.id] || [];
  const name = id => id === 't' ? 'Ты' : ((AC().students.find(s => s.id === id) || {}).name || 'Ученица');
  return `<div class="page-top px"><button class="ibtn" data-act="back" aria-label="Назад">${ic('back')}</button><div class="pt-title"><span class="ttl">${esc(c.title)}</span><span class="sub">чат курса · ${studentsOf(c.id).length} ${pl(studentsOf(c.id).length, ['участница','участницы','участниц'])}</span></div></div>
    <div class="page-body px" id="pageBody"><div class="msgs">${msgs.length ? msgs.map(m => `<div class="msg ${m.from === 't' ? 'me' : ''}"><div class="who">${esc(name(m.from))}</div>${esc(m.text)}<div class="tm">${fmtTime(m.ts)}</div></div>`).join('') : '<div class="empty"><b>Здесь пока тихо</b><span>Напиши первое сообщение курсу.</span></div>'}</div></div>
    <div class="page-foot px"><input id="chatIn" class="in" style="border-radius:22px" data-m="ui.chatText" placeholder="Сообщение ученицам" value="${esc(ui.chatText)}" autocomplete="off"><button class="ibtn fill" style="width:46px;height:46px;border-radius:50%" data-act="chatSend" aria-label="Отправить">${ic('send')}</button></div>`;
}

/* ============================================================
   ШИТЫ
============================================================ */
const shell = (title, body, foot = '', back = false) => `<div class="sheet-h px">${back ? `<button class="ibtn" data-act="closeSheet" aria-label="Назад">${ic('back')}</button>` : ''}<h2>${title}</h2>${back ? '' : `<button class="ibtn" data-act="closeSheet" aria-label="Закрыть">${ic('x')}</button>`}</div><div class="sheet-b px">${body}</div>${foot ? `<div class="sheet-f px">${foot}</div>` : ''}`;
const fld = (label, id, model, val, o = {}) => `<div class="fld"><label class="lbl" for="${id}">${label}</label><input id="${id}" class="in" ${o.num ? 'inputmode="decimal" data-num' : ''} ${o.type ? `type="${o.type}"` : ''} ${o.list ? `list="${o.list}"` : ''} data-m="${model}" value="${esc(o.num ? nv(val) : val)}" ${o.ph ? `placeholder="${esc(o.ph)}"` : ''}></div>`;
const opts = (arr, cur) => arr.map(v => `<option ${v === cur ? 'selected' : ''}>${esc(v)}</option>`).join('');
const subsList = () => `<datalist id="dl_subs">${[...new Set(S.materials.map(m => m.subcategory).filter(Boolean))].map(s => `<option value="${esc(s)}">`).join('')}</datalist>`;
const toolHint = `<p class="hint">Как считать: цена инструмента ÷ на сколько применений его хватит. Например, 180 ÷ 15 = 12 за одно применение.</p>`;

const SHEETS = {
  mat(s) {
    const m = mat(S, s.id), me = ui.me, adj = ui.adj, res = reservedBy(S, m.id), tool = isTool(m);
    const by = S.drafts.map(d => { const p = d.parts.find(x => x.id === m.id); return p ? {d, n: tool ? p.scrap : p.used + p.scrap} : null; }).filter(x => x && x.n > 0);
    const hist = S.movements.filter(x => x.materialId === m.id).sort((a, b) => b.date.localeCompare(a.date)).slice(0, 6);
    return shell(esc(m.name), `
      <div class="bigph"><img src="${photoOf(m)}" alt=""><button class="btn sm" data-act="matPhoto">${ic('camera', 'sm')} Заменить фото</button></div>
      <div class="stats"><div class="stat"><div class="v num">${num(m.qty)} ${esc(m.unit)}</div><div class="k">на складе</div></div><div class="stat"><div class="v num">${num(res)}</div><div class="k">в резерве</div></div><div class="stat"><div class="v num">${num(m.qty - res)}</div><div class="k">свободно</div></div></div>
      <div class="row" style="justify-content:space-between"><span class="mute">Средняя цена</span><b class="num">${money(m.avg)} / ${esc(m.unit)}</b></div>
      ${by.length ? `<div class="alert warn">${ic('clock')}<div>Зарезервировано в работах: ${by.map(x => `${esc(x.d.name)} (${num(x.n)})`).join(', ')}</div></div>` : ''}
      <div class="sect" style="padding-top:0"><h2>Карточка</h2></div>
      ${fld('Название', 'me_n', 'ui.me.name', me.name)}
      <div class="two"><div class="fld"><label class="lbl" for="me_c">Группа</label><select id="me_c" class="in" data-m="ui.me.category">${opts(S.categories, me.category)}</select></div>${fld('Подгруппа', 'me_s', 'ui.me.subcategory', me.subcategory, {list: 'dl_subs', ph: 'Hotfix, цепочки…'})}</div>
      <div class="two">${fld('Бренд', 'me_b', 'ui.me.brand', me.brand)}${fld('Артикул', 'me_k', 'ui.me.sku', me.sku)}</div>
      <div class="two">${fld('Размер', 'me_z', 'ui.me.size', me.size)}${fld('Цвет', 'me_l', 'ui.me.color', me.color)}</div>
      <div class="two"><div class="fld"><label class="lbl" for="me_u">Единица учёта</label><select id="me_u" class="in" data-m="ui.me.unit">${opts(UNITS, me.unit)}</select></div>${fld('Минимум на складе', 'me_mn', 'ui.me.min', me.min, {num: 1})}</div>
      <div class="fld"><span class="lbl">Тип материала</span><div class="seg"><button class="${me.mode === 'cons' ? 'on' : ''}" data-act="meMode" data-v="cons">Расходник</button><button class="${me.mode === 'tool' ? 'on' : ''}" data-act="meMode" data-v="tool">Многоразовый инструмент</button></div></div>
      ${me.mode === 'tool' ? `<div class="two">${fld('Хватит на, применений', 'me_life', 'ui.me.life', me.life, {num: 1, ph: 'например, 15'})}${fld('Одно применение, ' + sym(), 'me_uc', 'ui.me.useCost', me.useCost, {num: 1})}</div>${toolHint}` : ''}
      ${fld('Где лежит', 'me_loc', 'ui.me.location', me.location)}
      <div class="fld"><label class="lbl" for="me_nt">Заметки</label><textarea id="me_nt" class="in ta" data-m="ui.me.notes">${esc(me.notes)}</textarea></div>
      <div class="sect" style="padding-top:0"><h2>Корректировка количества</h2></div>
      <div class="two"><div class="fld"><label class="lbl" for="ad_q">Реально на складе</label><input id="ad_q" class="in" inputmode="decimal" data-num data-m="ui.adj.qty" value="${nv(adj.qty)}"></div>
        <div class="fld"><label class="lbl" for="ad_r">Причина</label><select id="ad_r" class="in" data-m="ui.adj.reason">${opts(REASONS, adj.reason)}</select></div></div>
      <button class="btn" data-act="matAdjust">Применить корректировку</button>
      ${hist.length ? `<div class="sect" style="padding-top:0"><h2>Движения</h2></div><div class="hist">${hist.map(h => `<div class="h"><span>${fmtDate(h.date)} · ${esc(h.reason)}</span><b class="num ${h.delta >= 0 ? 'pos' : 'neg'}">${h.delta >= 0 ? '+' : ''}${num(h.delta)}</b></div>`).join('')}</div>` : ''}
      ${subsList()}`, `<button class="btn pri block" data-act="matSave">Сохранить карточку</button>`);
  },
  cats() {
    return shell('Категории', `<div class="row"><input id="cat_new" class="in" data-m="ui.catNew" placeholder="Новая категория" value="${esc(ui.catNew)}" aria-label="Новая категория"><button class="btn pri" data-act="catAdd" aria-label="Добавить">${ic('plus')}</button></div>
      <p class="hint">Список всегда по алфавиту. Нажми на число, чтобы увидеть материалы категории на складе. Название меняется, когда уходишь из поля.</p>
      ${S.categories.map((c, i) => { const n = S.materials.filter(m => m.category === c).length;
        return `<div class="row"><input class="in" data-cat="${i}" value="${esc(c)}" aria-label="Название категории"><button class="pill clay" data-act="catGo" data-v="${esc(c)}" aria-label="Показать на складе">${n} ${ic('chev', 'sm')}</button><button class="ibtn sm" data-act="catDel" data-i="${i}" aria-label="Удалить" ${n ? 'disabled style="opacity:.35"' : ''}>${ic('trash', 'sm')}</button></div>`; }).join('')}
      <p class="hint">Категорию с материалами удалить нельзя. Сначала перенеси их в другую.</p>`);
  },
  line() { return shell(ui.lf.key ? 'Позиция закупки' : 'Новая позиция', lineBody(), `${ui.lf.dirty && !ui.lf.key ? '<button class="btn" data-act="lfReset">Очистить</button>' : ''}<button class="btn pri" style="flex:1" data-act="saveLine">Сохранить позицию</button>`, true); },
  pick() {
    const pk = ui.pk;
    return shell(pk.mode === 'draft' || pk.mode === 'lesson' ? 'Добавить материалы' : pk.mode === 'replace' ? 'Чем заменить' : 'Выбрать материал',
      `<label class="search">${ic('search')}<input id="pk_q" data-m="ui.pk.q" type="search" autocomplete="off" placeholder="Поиск по складу" value="${esc(pk.q)}"></label>
       <div class="chips" style="padding-top:0" id="pk_chips">${pickChips()}</div><div id="pk_grid">${pickGrid()}</div>`,
      pk.mode === 'draft' || pk.mode === 'lesson' ? `<button class="btn pri block" data-act="closeSheet">Готово</button>` : '', pk.mode !== 'draft' && pk.mode !== 'lesson');
  },
  cur() {
    const q = ui.curQ.toLowerCase(), cur = ui.curMode === 'base' ? S.settings.base : (ui.pf ? ui.pf.currency : base());
    const list = CURS.filter(c => !q || c[0].toLowerCase().includes(q) || c[2].toLowerCase().includes(q) || c[1].toLowerCase().includes(q));
    return shell(ui.curMode === 'base' ? 'Моя валюта' : 'Валюта закупки', `<label class="search">${ic('search')}<input id="cur_q" data-m="ui.curQ" type="search" autocomplete="off" placeholder="Код или название" value="${esc(ui.curQ)}"></label>
      <div id="curList">${curListHTML(list, cur)}</div>`);
  },
  newWork() {
    const nw = ui.nw;
    return shell('Новая работа', `<div class="seg"><button class="${nw.tab === 'new' ? 'on' : ''}" data-act="nwTab" data-v="new">С нуля</button><button class="${nw.tab === 'tpl' ? 'on' : ''}" data-act="nwTab" data-v="tpl">По дизайну</button></div>
      ${nw.tab === 'new' ? `${fld('Название', 'nw_n', 'ui.nw.name', nw.name, {ph: 'Например, Серьги «Утро»'})}
        <div class="fld"><label class="lbl" for="nw_k">Вид изделия</label><select id="nw_k" class="in" data-m="ui.nw.kind">${opts(KINDS, nw.kind)}</select></div>`
        : S.products.map(p => `<button class="lcard" data-act="startTpl" data-id="${p.id}"><img class="thumb" src="${p.photo}" alt=""><div class="grow"><div class="t">${esc(p.name)}</div><div class="s">${p.bom.length} материалов по рецепту</div></div>${ic('chev')}</button>`).join('')}`,
      nw.tab === 'new' ? `<button class="btn pri block" data-act="nwCreate">Начать работу</button>` : '');
  },
  pview(s) {
    const p = S.purchases.find(x => x.id === s.id);
    return shell(esc(p.supplier || 'Без поставщика'), `<p class="hint">${fmtDate(p.date)}${p.currency !== base() ? ` · ${p.currency}, курс ${num(p.fx)}` : ''}</p>
      <div class="card">${p.lines.map(l => { const m = mat(S, l.materialId);
        return `<div class="rl"><img class="thumb" src="${photoOf(m)}" alt=""><div class="a"><b>${esc(m ? m.name : 'Материал удалён')}</b><span class="num">${num(l.packs)} уп. × ${num(l.upp)} = ${num(l.count)} ${m ? esc(m.unit) : ''}</span><span class="num">доставка в цене: ${money(l.share)}</span></div><div class="c">${money(l.unitCost)}<small style="color:var(--ink2)">за ${m ? esc(m.unit) : 'ед.'}</small></div></div>`; }).join('')}</div>
      <div class="card"><div class="kv"><span>Товары</span><b>${money(p.lines.reduce((a, l) => a + l.totalTry, 0))}</b></div><div class="kv"><span>Доставка</span><b>${money(p.delivery)}</b></div><div class="kv total"><span>Итого</span><b>${money(purchaseTotal(p))}</b></div></div>
      <p class="hint">Цена за единицу уже включает свою долю доставки и считается по фактическим единицам, а не по упаковкам.</p>`);
  },
  sale() {
    const f = S.finished.find(x => x.id === ui.sale.id), sl = ui.sale, sold = f.status === 'sold';
    return shell(sold ? 'Данные продажи' : 'Отметить продажу', `<div class="row"><img class="thumb" src="${f.photo || placeholder(f.name)}" alt=""><div class="grow"><div style="font-weight:800">${esc(f.name)}</div><div class="hint">Себестоимость ${money(f.cost)}</div></div></div>
      <div class="two">${fld('Цена продажи, ' + sym(), 'sl_p', 'ui.sale.price', sl.price, {num: 1})}${fld('Дата продажи', 'sl_d', 'ui.sale.date', sl.date, {type: 'date'})}</div>
      ${fld('Имя покупателя', 'sl_b', 'ui.sale.buyer', sl.buyer, {ph: 'Например, Елена К.'})}
      <div class="two">${fld('Телефон', 'sl_ph', 'ui.sale.phone', sl.phone, {type: 'tel', ph: '+90 …'})}<div class="fld"><label class="lbl" for="sl_ch">Где продано</label><select id="sl_ch" class="in" data-m="ui.sale.channel">${opts(CHANNELS, sl.channel)}</select></div></div>
      ${fld('Куда уехало (страна, город)', 'sl_ds', 'ui.sale.dest', sl.dest, {ph: 'Например, Анкара, Турция'})}
      <div class="fld"><label class="lbl" for="sl_ad">Адрес доставки (если есть)</label><textarea id="sl_ad" class="in ta" data-m="ui.sale.address" placeholder="Улица, дом, индекс или отделение службы доставки">${esc(sl.address)}</textarea></div>
      <div class="fld"><label class="lbl" for="sl_nt">Заметка</label><input id="sl_nt" class="in" data-m="ui.sale.note" value="${esc(sl.note)}" placeholder="Трек-номер, пожелания"></div>
      <p class="hint">Данные покупателей хранятся только на этом устройстве. В настоящем приложении понадобится согласие покупателей и защита персональных данных по законам твоих стран.</p>`,
      `${sold ? '<button class="btn dng" data-act="saleUndo">Отменить продажу</button>' : ''}<button class="btn acc" style="flex:1" data-act="saleConfirm">${ic('check')} Сохранить</button>`);
  },
  crop() {

function pfCalc() {
  const pf = ui.pf, fx = pf.currency === base() ? 1 : pf.fx;
  const rows = pf.lines.map(l => ({l, units: l.packs * l.upp, sum: l.packs * l.pricePack * fx}));
  const shares = allocateDelivery(rows.map(r => r.sum), pf.delivery);
  rows.forEach((r, i) => { r.share = shares[i]; r.unit = r.units > 0 ? (r.sum + r.share) / r.units : 0; });
  const items = rows.reduce((a, r) => a + r.sum, 0);
  return {rows, items, delivery: pf.delivery, grand: items + pf.delivery};
}
