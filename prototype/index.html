  if (k === 'reserve' || k === 'time' || k === 'finish') { ui.tab = 'work'; const d = dr(); if (d) { ui.pages = [{type: 'draft', id: d.id}]; if (k === 'finish') { ui.fin = {photo: null, src: null, params: null, note: ''}; ui.pages.push({type: 'finish', id: d.id}); } } else toast('Активных работ нет'); }
  else if (k === 'purchase') { ui.tab = 'buy'; A.newPurchase(); renderScreen(); renderTabbar(); return; }
  else if (k === 'search') { ui.tab = 'stock'; ui.cat = 'all'; ui.sub = 'all'; ui.q = 'SS16'; }
  else if (k === 'sale' || k === 'stats') { ui.tab = 'arch'; ui.archSeg = k === 'sale' ? 'fin' : 'stats'; ui.stat = {mode: 'month', y: nowD.getFullYear(), m: nowD.getMonth() + 1}; }
  else if (k === 'academy') { ui.mode = 'acad'; ui.atab = 'courses'; }
  else if (k === 'backup') { ui.tab = 'more'; ui.sheets = [{type: 'exp'}]; }
  render(); if (k === 'time') toast('Впиши минуты в поле «Вручную»');
};

/* академия */
A.newCourse = () => { ui.nc = {title: '', price: 0, desc: ''}; pushSheet({type: 'newCourse'}); };
A.ncCreate = () => { const n = ui.nc; if (!n.title.trim()) { toast('Дай курсу название'); return; }
  const c = {id: uid('c'), title: n.title.trim(), price: n.price, status: 'draft', kind: 'flower', hex: ['#5f7a52', '#c2693f', '#d39a2f', '#8a5bc4'][AC().courses.length % 4], desc: n.desc, lessons: []};
  AC().courses.unshift(c); AC().chats[c.id] = []; save(); ui.sheets = []; render(); go({type: 'course', id: c.id}); toast('Курс создан как черновик'); };
A.openCourse = el => go({type: 'course', id: el.dataset.id});
A.courseStatus = el => { const c = curCourse(); c.status = el.dataset.v; save(); renderPages(); renderScreen(); toast(c.status === 'pub' ? 'Курс открыт для продажи' : 'Курс скрыт'); };
A.courseDel = () => { const c = curCourse(); ask('Удалить курс?', 'Курс, его уроки и чат будут удалены. Ученицы останутся в списке.', 'Удалить', true, () => { AC().courses = AC().courses.filter(x => x.id !== c.id); delete AC().chats[c.id]; AC().students.forEach(s => s.enrolls = s.enrolls.filter(e => e.courseId !== c.id)); save(); ui.pages = []; render(); toast('Курс удалён'); }); };
A.addLesson = () => { ui.ls = {isNew: true, courseId: curCourse().id, id: uid('l'), title: '', min: 10, free: false, video: '', desc: '', bom: []}; pushSheet({type: 'lesson'}); };
A.openLesson = el => { const c = curCourse(), l = c.lessons.find(x => x.id === el.dataset.id); ui.ls = {isNew: false, courseId: c.id, id: l.id, title: l.title, min: l.min, free: l.free, video: l.video, desc: l.desc, bom: l.bom.map(b => ({...b}))}; pushSheet({type: 'lesson'}); };
A.lsFree = el => { ui.ls.free = el.dataset.v === '1'; renderSheets(); };
A.bomAdd = () => { ui.pk = {mode: 'lesson', q: '', cat: 'all'}; pushSheet({type: 'pick'}); };
A.bomDel = el => { ui.ls.bom.splice(+el.dataset.i, 1); renderSheets(); };
A.lessonSave = () => { const ls = ui.ls, c = courseById(ls.courseId); if (!ls.title.trim()) { toast('Дай уроку название'); return; }
  const item = {id: ls.id, title: ls.title.trim(), min: ls.min, free: ls.free, video: ls.video.trim(), desc: ls.desc, bom: ls.bom};
  const i = c.lessons.findIndex(x => x.id === ls.id); if (i >= 0) c.lessons[i] = item; else c.lessons.push(item); save(); popSheet(); render(); toast('Урок сохранён'); };
A.lessonDel = () => { const ls = ui.ls, c = courseById(ls.courseId); c.lessons = c.lessons.filter(x => x.id !== ls.id); save(); popSheet(); render(); toast('Урок удалён'); };
A.lessonWork = () => { const ls = ui.ls; const d = newDraft(S, {name: ls.title || 'Работа по уроку', kind: 'Другое', bom: ls.bom}); ui.pages = []; ui.sheets = []; openNewDraft(d); toast('Материалы урока перенесены в твою работу'); };
A.openChat = el => { ui.sheets = []; ui.chatText = ''; const id = el.dataset.id; if (curPage() && curPage().type === 'chat') ui.pages.pop(); go({type: 'chat', id}); };
A.chatSend = () => { const p = curPage(), t = (ui.chatText || '').trim(); if (!t) return; (AC().chats[p.id] = AC().chats[p.id] || []).push({id: uid('x'), from: 't', text: t, ts: Date.now()}); ui.chatText = ''; save(); renderPages(); renderScreen(); const i = $('#chatIn'); if (i) i.focus(); };
A.addStudent = () => { if (!AC().courses.length) { toast('Сначала создай курс'); return; } const c = curCourse(), first = AC().courses[0]; ui.sheets = []; ui.ns = {name: '', contact: '', courseId: c ? c.id : first.id, paid: c ? c.price : first.price, date: todayISO()}; pushSheet({type: 'addStudent'}); };
A.nsSave = () => { const n = ui.ns; if (!n.name.trim()) { toast('Укажи имя ученицы'); return; }
  AC().students.unshift({id: uid('s'), name: n.name.trim(), contact: n.contact.trim(), joined: n.date, enrolls: [{courseId: n.courseId, paid: n.paid, date: n.date, done: []}]});
  save(); popSheet(); render(); celebrate(); toast('Ученица добавлена, доступ открыт'); };
A.openStudent = el => pushSheet({type: 'student', id: el.dataset.id});
A.doneToggle = el => { const s = AC().students.find(x => x.id === el.dataset.s), e = s.enrolls.find(x => x.courseId === el.dataset.c), l = el.dataset.l; e.done = e.done.includes(l) ? e.done.filter(x => x !== l) : e.done.concat(l); save(); renderSheets(); renderScreen(); };

/* ============================================================
   СОБЫТИЯ
============================================================ */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const f = A[el.dataset.act]; if (f) f(el, e);
});
function rootOf(n) { return n === 'ui' ? ui : n === 'S' ? S : n === 'D' ? curDraft() : n === 'R' ? curRun() : n === 'C' ? curCourse() : null; }
function onModel(el) {
  const path = el.dataset.m; if (!path) return; const parts = path.split('.');
  let o = rootOf(parts[0]); if (!o) return;
  for (let i = 1; i < parts.length - 1; i++) o = o[parts[i]];
  const key = parts[parts.length - 1];
  o[key] = el.hasAttribute('data-num') ? nz(el.value) : el.value;
  if (path === 'ui.q') refreshStock();
  else if (path === 'ui.pk.q') { const g = $('#pk_grid'); if (g) g.innerHTML = pickGrid(); }
  else if (path === 'ui.curQ') { const l = $('#curList'); const q = ui.curQ.toLowerCase(); if (l) l.innerHTML = curListHTML(CURS.filter(c => !q || c[0].toLowerCase().includes(q) || c[2].toLowerCase().includes(q)), ui.curMode === 'base' ? S.settings.base : ui.pf.currency); }
  else if (parts[0] === 'D') { save(); refreshDraft(true); }
  else if (path.startsWith('ui.lf.')) {
    ui.lf.dirty = true;
    if (path === 'ui.lf.life') { const u = lfUnitPrice(); if (ui.lf.life > 0 && u > 0) { ui.lf.useCost = r2(u / ui.lf.life); const x = $('#lf_uc'); if (x) x.value = nv(ui.lf.useCost); } }
    refreshLine();
  }
  else if (path === 'ui.me.life') { const s = ui.sheets[ui.sheets.length - 1], m = s && mat(S, s.id); if (m && ui.me.life > 0 && m.avg > 0) { ui.me.useCost = r2(m.avg / ui.me.life); const x = $('#me_uc'); if (x) x.value = nv(ui.me.useCost); } }
  else if (path.startsWith('ui.pf.')) { save(); refreshPf(); }
  else if (parts[0] === 'S' || parts[0] === 'R') save();
  else if (parts[0] === 'C') { save(); if (path === 'C.title' || path === 'C.price') renderScreen(); }
}
document.addEventListener('input', e => {
  const t = e.target; if (t.id === 'cropZoom') { ui.crop.zoom = +t.value; cropApply(); return; }
  if (t.dataset && t.dataset.bom !== undefined) { ui.ls.bom[+t.dataset.bom].qty = nz(t.value); return; }
  if (t.dataset && t.dataset.m && t.tagName !== 'SELECT' && t.type !== 'date') onModel(t);
});
document.addEventListener('focusin', e => { if (e.target.matches && e.target.matches('.step input')) setTimeout(() => e.target.select(), 0); });
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset && t.dataset.part !== undefined) { const d = curDraft(); if (d) setPart(d, +t.dataset.part, t.dataset.f, nz(t.value)); return; }
  if (t.dataset && t.dataset.cat !== undefined) {
    const i = +t.dataset.cat, old = S.categories[i], nn = t.value.trim();
    if (!nn || (nn !== old && S.categories.some(c => c.toLowerCase() === nn.toLowerCase()))) { toast(nn ? 'Такая категория уже есть' : 'Название не может быть пустым'); t.value = old; return; }
    S.categories[i] = nn; S.categories.sort(ruCmp); S.materials.forEach(m => { if (m.category === old) m.category = nn; }); if (ui.cat === old) ui.cat = nn; save(); renderScreen(); renderSheets(); toast('Категория переименована'); return;
  }
  if (t.dataset && t.dataset.m && (t.tagName === 'SELECT' || t.type === 'date')) { onModel(t); if (t.dataset.m === 'ui.lf.unit') refreshLine(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (ui.sheets.length) A.closeSheet(); else if (ui.pages.length) A.back(); }
  if (e.key === 'Enter' && e.target.dataset) { if (e.target.dataset.part !== undefined) e.target.blur(); if (e.target.id === 'chatIn') A.chatSend(); }
});
setInterval(() => {
  const p = curPage(); if (!p || p.type !== 'draft') return;
  const d = curDraft(); if (!d) return;
  const c = $('#clock'); if (c) c.textContent = fmtClock(d.elapsedMs + (d.runningSince ? Date.now() - d.runningSince : 0));
  if (d.runningSince) { const tu = $('#timeUsed'); if (tu) tu.textContent = timeUsedText(d); const tt = $('#totals'); if (tt && !tt.contains(document.activeElement)) tt.innerHTML = totalsHTML(d); }
}, 1000);

$('#side').innerHTML = sideHTML();
render();
})();
