<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Создатель сценариев каруселей</title>
  <meta name="description" content="Пишет тексты для каруселей в Instagram: слайды, подпись и готовый экспорт.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%237a2e45'/%3E%3Crect x='7' y='9' width='11' height='14' rx='2.5' fill='%23fff' opacity='.55'/%3E%3Crect x='12' y='9' width='13' height='14' rx='2.5' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;600;700&display=swap&subset=cyrillic" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar__inner">
      <button class="brand" id="brand" type="button" aria-label="На главную">
        <span class="brand__mark" aria-hidden="true"></span>
        <span class="brand__name">Сценарии каруселей</span>
      </button>
      <nav class="nav" aria-label="Разделы">
        <button class="nav__btn is-active" data-nav="create" type="button">Создать</button>
        <button class="nav__btn" data-nav="projects" type="button">Проекты <span class="nav__count" id="projectsCount">0</span></button>
      </nav>
    </div>
  </header>

  <main class="page" id="app" tabindex="-1"></main>

  <dialog class="dialog" id="dialog">
    <form method="dialog" class="dialog__box">
      <h2 class="dialog__title" id="dialogTitle"></h2>
      <p class="dialog__text" id="dialogText"></p>
      <div class="dialog__actions">
        <button class="btn btn--ghost" value="cancel" id="dialogCancel">Отмена</button>
        <button class="btn btn--danger" value="ok" id="dialogOk">Подтвердить</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js" type="module"></script>
</body>
</html>
